<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xyla is turning 3 — you’re invited</title>
<meta name="description" content="An invitation to Xyla’s 3rd birthday party.">
<meta name="theme-color" content="#FFD84D">

<!-- Link previews. Without these, texting the invitation to somebody unfurls
     as a naked storage.googleapis.com URL, which looks like spam rather than
     like an invitation. Title and description are rewritten from config.js at
     build time along with the noscript block.
     Deliberately NO og:image: that would push a photograph of a three-year-old
     into every unfurl cache that touches the link. -->
<!--SHARE-META-->
<meta property="og:type" content="website">
<meta property="og:title" content="Xyla is turning 3 — you’re invited">
<meta property="og:description" content="A butterfly-pirate-robot-dinosaur pool party.">
<meta name="twitter:card" content="summary">
<!--/SHARE-META-->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍋</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip-link" href="#invite-card">Skip to the party details</a>

<!-- ============================ THE STAGE ============================= -->
<!-- Entirely decorative. Screen readers are given the invitation, not this. -->
<div id="stage" aria-hidden="true" role="presentation">
  <div class="layer" id="l-sky"><canvas id="sky-canvas"></canvas></div>
  <div class="layer" id="l-stars"></div>
  <div class="layer" id="l-far"></div>
  <div class="layer" id="l-mid"></div>
  <div class="layer" id="l-fleet"></div>
  <div class="layer" id="l-cast">
    <!-- The backdrop behind Captain Xyla at the reveal. It says "3rd BIRTHDAY"
         rather than a bare numeral, so the single most-photographed frame of
         the whole piece states what the occasion is on its own. -->
    <div id="bigthree" class="bigthree">
      <svg viewBox="0 0 620 210" aria-hidden="true" focusable="false">
        <text x="310" y="152" text-anchor="middle"
              font-family="ui-rounded, 'SF Pro Rounded', system-ui, sans-serif"
              font-weight="900"
              fill="#FFD84D" stroke="#2A1B4A" stroke-width="9"
              paint-order="stroke">
          <tspan font-size="150" style="letter-spacing:-.04em">3</tspan><tspan
                 font-size="68" dy="-52">rd</tspan><tspan
                 font-size="62" dy="52" dx="26"
                 style="letter-spacing:.06em">BIRTHDAY</tspan>
        </text>
      </svg>
    </div>
  </div>
  <div class="layer" id="l-fore"><canvas id="fore-canvas"></canvas></div>
</div>

<!-- ============================== UI ================================== -->
<div id="ui">

  <div class="topbar">
    <!-- Filled from CONFIG.PARTY at boot so it can never drift from the card.
         The second line is the whole point: whose birthday and when, on screen
         in every single frame of the story. -->
    <span class="brandmark" id="brandmark">
      <b>🍋 Xyla’s 3rd Birthday</b>
      <i id="brand-when"></i>
    </span>
    <div class="topbar-actions">
      <button type="button" class="btn btn-primary" id="open-details">Details &amp; RSVP</button>
    </div>
  </div>

  <div class="storytitle" id="storytitle">
    <p class="kicker">You’re invited to</p>
    <h1><span class="title-word">Captain</span> <span class="title-word">Xyla</span></h1>
    <p class="sub">and the Lemon Sea</p>
    <!-- The plain facts, on the cover, at second two. Everything above this
         line is atmosphere; this is the part Grandma actually needs. -->
    <p class="cover-facts" id="cover-facts"></p>
  </div>

  <!-- One line of story per act. Decorative narration: the real information
       lives in the invitation card, which screen readers get instead. -->
  <p class="narration" id="narration" aria-hidden="true"></p>

  <div class="controls" id="controls">
    <button type="button" class="btn btn-icon" id="btn-play" aria-label="Play the story">▶</button>
    <div class="chapters" id="chapters" role="group" aria-label="Story chapters"></div>
    <input type="range" class="scrubber" id="scrubber" min="0" max="1000" value="0" step="1"
           aria-label="Scrub through the story">
    <button type="button" class="btn btn-icon" id="btn-mute" aria-pressed="false" aria-label="Turn music on">♪̸</button>
    <button type="button" class="btn btn-icon" id="btn-calm" aria-pressed="false" aria-label="Calm mode — stop the animation">☾</button>
  </div>

</div>

<!-- ========================= INVITATION SHEET ========================= -->
<div id="sheet" aria-hidden="true">
  <div class="sheet-inner">
    <button type="button" class="btn btn-icon sheet-close" id="sheet-close" aria-label="Close">✕</button>
    <main class="card" id="invite-card"></main>
    <section class="card rsvp" id="rsvp-panel" hidden></section>
  </div>
</div>

<!-- ============================== GATE =============================== -->
<div id="gate">
  <div class="gate-inner">
    <div class="storytitle" style="margin:0">
      <p class="kicker">You are invited to</p>
      <h1 style="font-size:clamp(34px,10vw,72px)">Xyla’s 3rd Birthday</h1>
      <!-- The date belongs on the very first screen. Plenty of people will
           read this and never tap anything. Filled from CONFIG at boot. -->
      <p class="gate-when" id="gate-when"></p>
    </div>
    <button type="button" class="btn btn-primary btn-big" id="btn-open"
            style="max-width:320px">Open the invitation</button>
    <p>Tap to begin — it plays with music</p>
  </div>
</div>

<!-- The details for anyone without JavaScript — and for link previews and
     search crawlers, which do not run the story either. The values between
     the markers are REPLACED AT BUILD TIME from config.js by tools/build.js;
     editing them here by hand will just be overwritten. -->
<noscript>
  <div class="card noscript-card">
    <h1>Xyla is turning 3!</h1>
    <p>You’re invited to a butterfly-pirate-robot-dinosaur pool party.</p>
    <p>This invitation has an animated story, which needs JavaScript — but the
       important part is right here:</p>
    <!--NOSCRIPT-DETAILS-->
    <dl>
      <dt>When</dt><dd>Date here · Time here</dd>
      <dt>Where</dt><dd>Place here, Address here</dd>
      <dt>RSVP</dt><dd><a href="mailto:mom@example.com">mom@example.com</a></dd>
    </dl>
    <!--/NOSCRIPT-DETAILS-->
  </div>
</noscript>

<script src="vendor/gsap/gsap.min.js"></script>
<script src="vendor/gsap/MorphSVGPlugin.min.js"></script>
<script src="config.js"></script>
<script src="js/core.js"></script>
<script src="js/palette.js"></script>
<script src="js/creature.js"></script>
<script src="js/hero.js"></script>
<script src="js/ufo.js"></script>
<script src="js/sky.js"></script>
<script src="js/parallax.js"></script>
<script src="js/confetti.js"></script>
<script src="js/audio.js"></script>
<script src="js/invite.js"></script>
<script src="js/story.js"></script>
<script src="js/main.js"></script>
</body>
</html>
