<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morph Lab</title>
<style>
  body { margin:0; background:#EDE7FB; font:13px/1.4 ui-rounded, system-ui, sans-serif; color:#2A1B4A; }
  h1 { font-size:16px; padding:10px 14px 0; margin:0; }
  .row { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding:10px 14px; }
  .cell { background:#FFF8EE; border-radius:12px; padding:4px; text-align:center; }
  .cell svg { width:100%; height:auto; display:block; }
  .u { font-size:10px; opacity:.6; }
</style>
</head>
<body>
<h1>Morph intermediates — a mangled shape here means broken point correspondence</h1>
<div id="out"></div>

<script src="vendor/gsap/gsap.min.js"></script>
<script src="vendor/gsap/MorphSVGPlugin.min.js"></script>
<script src="config.js"></script>
<script src="js/core.js"></script>
<script src="js/palette.js"></script>
<script src="js/creature.js"></script>
<script>
  gsap.registerPlugin(MorphSVGPlugin);
  gsap.ticker.lagSmoothing(0);

  var out = document.getElementById('out');
  var PAIRS = [
    ['butterfly,pirate', 'robot,dino'],
    ['dino,robot',       'butterfly,pirate'],
    ['butterfly,dino',   'pirate,robot'],
  ];
  var STOPS = [0, 0.25, 0.5, 0.75, 1];

  PAIRS.forEach(function (pair, pi) {
    var row = document.createElement('div');
    row.className = 'row';
    STOPS.forEach(function (u) {
      var from = XY.Creature.genome('lab-' + pi + '-a', { kits: pair[0].split(',') });
      var to   = XY.Creature.genome('lab-' + pi + '-b', { kits: pair[1].split(',') });
      var c = XY.Creature.render(from);
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.appendChild(c.svg);
      var cap = document.createElement('div');
      cap.className = 'u';
      cap.textContent = 'u=' + u;
      cell.appendChild(cap);
      row.appendChild(cell);
      /* build the morph, then freeze it at exactly u */
      var tl = XY.Creature.morphTo(c, to);
      tl.pause();
      tl.progress(u);
    });
    out.appendChild(row);
  });
  document.title = 'ready';
</script>
</body>
</html>
