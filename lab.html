<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creature Lab — Xyla's Invitation</title>
<style>
  body { margin:0; background:#EDE7FB; font:14px/1.4 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color:#2A1B4A; }
  h1 { font-size:18px; padding:12px 16px 0; margin:0; }
  #sheet { display:grid; grid-template-columns:repeat(var(--cols,8), 1fr); gap:4px; padding:12px; }
  .cell { background:#FFF8EE; border-radius:14px; padding:4px; text-align:center; }
  .cell svg { width:100%; height:auto; display:block; }
  .cap { font-size:9px; opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kits { font-size:8px; opacity:.5; }
</style>
</head>
<body>
<h1>Creature contact sheet</h1>
<div id="sheet"></div>

<script src="vendor/gsap/gsap.min.js"></script>
<script src="js/core.js"></script>
<script src="js/palette.js"></script>
<script src="js/creature.js"></script>
<script src="js/hero.js"></script>
<script>
  var sheet = document.getElementById('sheet');
  var n = +(XY.params.n || 40);
  if (XY.params.cols) document.getElementById('sheet').style.setProperty('--cols', XY.params.cols);
  if (XY.params.kits) { }
  var base = XY.params.seed || 'xyla-3';
  if (XY.params.hero) {
    var h = XY.Hero.render({ hat: XY.params.hat !== '0' });
    var hc = document.createElement('div'); hc.className='cell';
    hc.appendChild(h.svg);
    var hn = document.createElement('div'); hn.className='cap'; hn.textContent='Captain Xyla';
    hc.appendChild(hn); sheet.appendChild(hc);
  }
  for (var i = 0; i < n; i++) {
    var g = XY.Creature.genome(base + ':' + i);
    var c = XY.Creature.render(g);
    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.appendChild(c.svg);
    var cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = c.name;
    var k = document.createElement('div');
    k.className = 'kits';
    k.textContent = g.kits.join('+');
    cell.appendChild(cap); cell.appendChild(k);
    sheet.appendChild(cell);
  }
  document.title = 'ready';
</script>
</body>
</html>
