    var print = printPattern(rand, headCX, shoulderY + 6, hemY - 2, halfTop, halfBot);
    s.lemons = { d: print.lemons, fill: '#FFD84D', stroke: '#F0A500', opacity: 1 };
    s.leaves = { d: print.leaves, fill: '#0E7C7B', opacity: 0.9 };

    /* ---- ARMS ---------------------------------------------------------- */
    ['L', 'R'].forEach(function (side) {
      var dir = side === 'L' ? -1 : 1;
      var sx = headCX + dir * halfTop * 0.9, ay = shoulderY + 6;
      var ang = dir > 0 ? 0.75 : Math.PI - 0.75, len = 30;
      var hx = sx + Math.cos(ang) * len, hy = ay + Math.sin(ang) * len;
      s['arm' + side] = {
        d: path.limb(sx, ay, len, ang, 6.5, dir * -6, { taper: 0.85, steps: 7 }) +
           ' ' + path.blob(hx, hy, 8.5, 8.5, { points: 14, wobble: 0.05, rand: rand }),
        fill: SKIN, stroke: INK, opacity: 1
      };
    });

    /* ---- HEAD ---------------------------------------------------------- */
    s.head = {
      d: path.blob(headCX, headCY, hRX, hRY, {
        points: 14, wobble: 0.02, rand: rand,
        shape: function (a) { return 1 + 0.07 * Math.sin(a); }
      }),
      fill: SKIN, stroke: INK, opacity: 1
    };

    ['L', 'R'].forEach(function (side) {
      var dir = side === 'L' ? -1 : 1;
      s['ear' + side] = {
        d: path.blob(headCX + dir * hRX * 0.97, headCY + 4, 7, 9, { points: 14, wobble: 0 }),
        fill: SKIN, stroke: INK, opacity: 1
      };
    });

    /* ---- HAIR, front — a soft fringe over the brow -------------------- */
    s.hairFront = {
      d: path.closedSpline([
        [headCX - hRX * 1.02, headCY - 4],
        [headCX - hRX * 0.8, headCY - hRY * 0.86],
        [headCX - hRX * 0.2, headCY - hRY * 1.12],
        [headCX + hRX * 0.45, headCY - hRY * 1.05],
        [headCX + hRX * 0.95, headCY - hRY * 0.6],
        [headCX + hRX * 1.04, headCY + 2],
        [headCX + hRX * 0.62, headCY - hRY * 0.3],
        [headCX + hRX * 0.1, headCY - hRY * 0.44],
        [headCX - hRX * 0.42, headCY - hRY * 0.26],
        [headCX - hRX * 0.72, headCY - hRY * 0.36],
      ], 0.85),
      fill: HAIR_LIGHT, stroke: INK, opacity: 1
    };

    /* ---- CURLS — the signature. A ring of overlapping blobs of varying
            size, which is what makes hair read as curly rather than as a
            helmet. Seeded, so her hair is the same every single load. ---- */
    var curls = [];
    for (var i = 0; i < 24; i++) {
      var a = (i / 24) * XY.TAU + rand.range(-0.08, 0.08);
      /* bias the mass outward and downward — windswept, not symmetrical */
      var rr = hRX * (1.34 + 0.16 * Math.sin(a * 2) + 0.1 * Math.sin(a + 1.3));
      var cx2 = headCX + 3 + Math.cos(a) * rr;
      var cy2 = headCY + 4 + Math.sin(a) * rr * 0.92;
      var cr = rand.range(9, 14);
      /* Curls pile up on top and down the sides and STOP around the jaw.
         Carried all the way round the chin they read as a lion's mane. */
      if (Math.sin(a) > 0.52) continue;
      /* Keep the whole face clear. Hair that creeps over the cheeks and mouth
         reads as a bush, not as a haircut — so any curl whose disc would
         intrude on the front of the face is simply dropped. */
      var faceDX = (cx2 - headCX) / (hRX + cr * 0.55);
      var faceDY = (cy2 - (headCY + 6)) / (hRY + cr * 0.5);
      if (faceDX * faceDX + faceDY * faceDY < 1 && cy2 > headCY - hRY * 0.55) continue;
      curls.push(path.blob(cx2, cy2, cr, cr * rand.range(0.85, 1.1),
                           { points: 14, wobble: 0.16, rand: rand }));
    }
    s.curls = { d: curls.join(' '), fill: HAIR, stroke: INK, opacity: 1 };

    /* ---- FACE ---------------------------------------------------------- */
    ['L', 'R'].forEach(function (side) {
      var dir = side === 'L' ? -1 : 1;
      s['cheek' + side] = {
        d: path.blob(headCX + dir * 27, headCY + 17, 8, 5.5, { points: 14, wobble: 0.04, rand: rand }),
        fill: '#FF8FB1', opacity: 0.55
      };
    });

    /* a big open happy smile */
    var a1 = [], b1 = [], j, t2;
    for (j = 0; j <= 8; j++) { t2 = j / 8; a1.push([headCX - 13 + 26 * t2, headCY + 20 + Math.sin(t2 * Math.PI) * 9]); }
    for (j = 8; j >= 0; j--) { t2 = j / 8; b1.push([headCX - 13 + 26 * t2, headCY + 20 + Math.sin(t2 * Math.PI) * 2.5]); }
    s.mouth = { d: path.closedSpline(a1.concat(b1), 0.8), fill: INK, opacity: 1 };

    /* ---- THE SUNGLASSES — oversized, round, and the whole personality -- */
    var gy = headCY - 2, gdx = 17, gr = 15;
    s.shadeStrap = {
      d: path.roundRect(headCX, gy - 1, gdx * 1.05, 4.5, 1) + ' ' +
         path.roundRect(headCX - gdx - gr * 1.15, gy - 3, 12, 4, 1) + ' ' +
         path.roundRect(headCX + gdx + gr * 1.15, gy - 3, 12, 4, 1),
      fill: '#3A3358', opacity: 1
    };
    var lens = function (x) {
      return path.blob(x, gy, gr * 1.22, gr * 1.1, {
        points: 14, wobble: 0,
        shape: function (a) { return 1 + 0.08 * Math.cos(a * 2); }
      });
    };
    s.shadeL = { d: lens(headCX - gdx), fill: '#2A2340', stroke: INK, opacity: 0.95 };
    s.shadeR = { d: lens(headCX + gdx), fill: '#2A2340', stroke: INK, opacity: 0.95 };
    /* two little highlights so the lenses look like glass, not holes */
    s.shadeGlint = {
      d: path.blob(headCX - gdx - 6, gy - 6, 5.5, 3.4, { points: 14, wobble: 0, rotate: -0.5 }) + ' ' +
         path.blob(headCX + gdx - 6, gy - 6, 5.5, 3.4, { points: 14, wobble: 0, rotate: -0.5 }),
      fill: '#FFFFFF', opacity: 0.5
    };

    /* ---- CAPTAIN'S HAT ------------------------------------------------- */
    if (withHat) {
      var hy = headCY - hRY * 1.42, hw = hRX * 1.5;
      s.hat = {
        d: path.closedSpline([
          [headCX - hw, hy - 8], [headCX - hw * 0.72, hy + 3], [headCX - hw * 0.38, hy - 11],
          [headCX, hy - 24], [headCX + hw * 0.38, hy - 11], [headCX + hw * 0.72, hy + 3],
          [headCX + hw, hy - 8], [headCX + hw * 0.9, hy + 10], [headCX + hw * 0.45, hy + 16],
          [headCX, hy + 18], [headCX - hw * 0.45, hy + 16], [headCX - hw * 0.9, hy + 10],
        ], 0.62),
        fill: '#2A1B4A', stroke: '#0B1730', opacity: 1
      };
      s.hatTrim = {
        d: path.closedSpline([
          [headCX - hw * 0.96, hy - 6], [headCX - hw * 0.7, hy + 4], [headCX - hw * 0.37, hy - 9],
          [headCX, hy - 21], [headCX + hw * 0.37, hy - 9], [headCX + hw * 0.7, hy + 4],
          [headCX + hw * 0.96, hy - 6], [headCX + hw * 0.86, hy + 8], [headCX + hw * 0.44, hy + 14],
          [headCX, hy + 16], [headCX - hw * 0.44, hy + 14], [headCX - hw * 0.86, hy + 8],
        ], 0.62) + ' ' + path.closedSpline([
          [headCX - hw * 0.82, hy - 3], [headCX - hw * 0.6, hy + 4], [headCX - hw * 0.32, hy - 6],
          [headCX, hy - 16], [headCX + hw * 0.32, hy - 6], [headCX + hw * 0.6, hy + 4],
          [headCX + hw * 0.82, hy - 3], [headCX + hw * 0.74, hy + 6], [headCX + hw * 0.38, hy + 11],
          [headCX, hy + 13], [headCX - hw * 0.38, hy + 11], [headCX - hw * 0.74, hy + 6],
        ].reverse(), 0.62),
        fill: '#FFD84D', opacity: 0.95
      };
      s.hatBadge = {
        d: path.blob(headCX, hy - 3, 9, 6.6, {
          points: 14, wobble: 0,
          shape: function (a) { return 1 + 0.22 * Math.pow(Math.abs(Math.cos(a)), 6); }
        }),
        fill: '#FFD84D', stroke: '#F0A500', opacity: 1
      };
    }

    return s;
  }

  function render(opts) {
    var sp = spec(opts);
    var svg = XY.svgEl('svg', {
      viewBox: '-30 -40 260 250', class: 'creature hero',
      'aria-hidden': 'true', focusable: 'false', overflow: 'visible'
    });
    var root = XY.svgEl('g', { class: 'c-root' });
    var body = XY.svgEl('g', { class: 'c-body' });
    var nodes = {};
    SLOTS.forEach(function (slot) {
      var a = sp[slot];
      var p = XY.svgEl('path', { d: a.d, fill: a.fill || 'none', opacity: a.opacity, 'data-slot': slot });
      if (a.stroke) {
        p.setAttribute('stroke', a.stroke);
        p.setAttribute('stroke-width', 3);
        p.setAttribute('stroke-linejoin', 'round');
        p.setAttribute('paint-order', 'stroke');
      }
      nodes[slot] = p;
      body.appendChild(p);
    });
    root.appendChild(body);
    svg.appendChild(root);
    return { svg: svg, root: root, body: body, nodes: nodes, spec: sp, name: 'Captain Xyla' };
  }

  /* Ambient life — she breathes, her curls bounce, her hat tips. */
  function animate(h) {
    var rand = XY.rng('xyla-anim');
    gsap.to(h.body, {
      scaleY: 1.04, scaleX: 0.98, duration: 1.7, repeat: -1, yoyo: true,
      ease: 'sine.inOut', transformOrigin: '100px 180px'
    });
    gsap.to(h.nodes.curls, {
      rotation: 1.6, scaleX: 1.02, duration: 2.3, repeat: -1, yoyo: true,
      ease: 'sine.inOut', transformOrigin: '100px 90px'
    });
    gsap.to([h.nodes.hat, h.nodes.hatTrim, h.nodes.hatBadge], {
      rotation: -2.5, duration: 2.9, repeat: -1, yoyo: true,
      ease: 'sine.inOut', transformOrigin: '100px 40px'
    });
    gsap.to(h.nodes.shadeGlint, {
      opacity: 0.85, duration: 2.1, repeat: -1, yoyo: true, ease: 'sine.inOut'
    });
  }

  /* ==========================================================================
   *  PHOTO MODE — the real Xyla, flying
   *  --------------------------------------------------------------------------
   *  The photograph is cut out (background removed by a segmentation model run
   *  locally — see tools/process-photos.mjs) and then the generated art is
   *  drawn *around* her: butterfly wings sprouting from behind her shoulders,
   *  the same pirate tricorn the drawn crew wears, and a soft glow.
   *
   *  She is already photographed with her arms out, which is why the wings
   *  land: she was halfway to flying before anyone drew anything.
   * ======================================================================== */

  /* Measured off the cutout (572x760). If the photo is ever re-cropped these
     are the numbers to revisit. */
  var PH = {
    w: 572, h: 760,
    headCX: 319, headCY: 190, headW: 220,
    backCX: 290, backCY: 400,     // where the wings sprout
  };

  /* --------------------------------------------------------------------------
   *  A real butterfly wing outline.
   *
   *  The generic `limb` ribbon used for the drawn crew makes a wedge with a
   *  blunt end — at this size that reads as a slab of cheese, not a wing. A
   *  wing needs a long convex leading edge, a rounded tip, and a shorter,
   *  slightly concave trailing edge. These are unit coordinates (x along the
   *  wing, y across it) scaled, rotated and mirrored per side.
   * ------------------------------------------------------------------------*/
  var FOREWING = [
    [0.00, 0.00], [0.20, -0.26], [0.46, -0.44], [0.71, -0.53],
    [0.92, -0.48], [1.04, -0.28], [1.03, -0.04], [0.88, 0.16],
    [0.66, 0.27], [0.44, 0.26], [0.25, 0.18], [0.09, 0.08],
  ];
  var HINDWING = [
    [0.00, 0.00], [0.22, -0.16], [0.48, -0.22], [0.72, -0.16],
    [0.88, 0.02], [0.90, 0.24], [0.78, 0.42], [0.58, 0.50],
    [0.38, 0.46], [0.22, 0.34], [0.10, 0.20], [0.03, 0.09],
  ];

  /* Rotate the unit wing in its own local space first, THEN mirror the whole
     rotated shape for the left side. Folding `dir` into the rotation itself
     (the obvious-looking shortcut) shears the wing into a blade. */
  function wingLocal(unit, len, spread, angle) {
    var ca = Math.cos(angle), sa = Math.sin(angle);
    return unit.map(function (p) {
      var lx = p[0] * len, ly = p[1] * len * spread;
      return [lx * ca - ly * sa, lx * sa + ly * ca];
    });
  }

  function wingPath(unit, cx, cy, len, spread, angle, dir) {
    var pts = wingLocal(unit, len, spread, angle).map(function (p) {
      return [cx + p[0] * dir, cy + p[1]];
    });
    return path.closedSpline(pts, 0.95);
  }

  function photoSpec(rand) {
    var s = {}, spots = [];
    /* sprout from the shoulder blades, above the elbows */
    var wingAnchorY = PH.backCY - 24;

    ['L', 'R'].forEach(function (side) {
      var dir = side === 'L' ? -1 : 1;
      var ax = PH.backCX + dir * 26;
      var upAng = -0.78;                       // mirrored by `dir` inside wingPath
      var upLen = 400;
      /* wings are long and narrow; a spread near 1 rounds them into balloons */
      var spread = 0.58;

      s['wingFront' + side] = {
        d: wingPath(FOREWING, ax, wingAnchorY, upLen, spread, upAng, dir),
        fill: '#FFD84D', stroke: INK, opacity: 0.96
      };
      s['wingBack' + side] = {
        d: wingPath(HINDWING, ax, wingAnchorY + 70, 250, 0.62, 0.34, dir),
        fill: '#FF8FB1', stroke: INK, opacity: 0.96
      };

      /* markings, echoing the butterfly printed on her shirt */
      var marks = [];
      [[0.42, -0.16, 30], [0.63, -0.24, 23], [0.80, -0.20, 16]].forEach(function (m) {
        /* same local-rotate-then-mirror rule as the wing outline itself */
        var q = wingLocal([[m[0], m[1]]], upLen, spread, upAng)[0];
        marks.push(path.blob(ax + q[0] * dir, wingAnchorY + q[1], m[2], m[2] * 0.92,
                             { points: 14, wobble: 0.07, rand: rand }));
      });
      s['wingSpot' + side] = { d: marks.join(' '), fill: '#FFF8EE', opacity: 0.75 };
    });

    /* a warm halo so she sits in the sky rather than on top of it */
    s.glow = {
      d: path.blob(PH.headCX, 340, 330, 340, { points: 14, wobble: 0.04, rand: rand }),
      fill: '#FFD84D', opacity: 0.1
    };

    /* sparkles around her */
    for (var k = 0; k < 7; k++) {
      var a = rand.range(0, XY.TAU), r = rand.range(280, 430);
      spots.push(path.star(PH.headCX + Math.cos(a) * r, 330 + Math.sin(a) * r * 0.85,
                           rand.range(9, 17), rand.range(3, 6), 4, rand.range(0, 1)));
    }
    s.sparkles = { d: spots.join(' '), fill: '#FFF8EE', opacity: 0.85 };

    return s;
  }

  function renderPhoto(opts) {
    opts = opts || {};
    var rand = XY.rng('xyla-photo');
    var sp = photoSpec(rand);
    var withHat = opts.hat !== false;

    var svg = XY.svgEl('svg', {
      /* Tight to the photo. The old box was 880 wide for a 572-wide picture,
         so a third of her declared width was empty padding and she rendered
         far smaller than the CSS size suggested. This still clears the wings
         and the sparkle ring, and nothing else. */
      viewBox: '-96 -56 764 856', class: 'creature hero hero-photo',
      'aria-hidden': 'true', focusable: 'false', overflow: 'visible'
    });
    var root = XY.svgEl('g', { class: 'c-root' });
    var body = XY.svgEl('g', { class: 'c-body' });
    var nodes = {};

    var add = function (slot, a) {
      var p = XY.svgEl('path', { d: a.d, fill: a.fill || 'none', opacity: a.opacity, 'data-slot': slot });
      if (a.stroke) {
        p.setAttribute('stroke', a.stroke);
        p.setAttribute('stroke-width', 5);
        p.setAttribute('stroke-linejoin', 'round');
        p.setAttribute('paint-order', 'stroke');
      }
      nodes[slot] = p;
      body.appendChild(p);
      return p;
    };

    add('glow', sp.glow);
    ['L', 'R'].forEach(function (d) { add('wingBack' + d, sp['wingBack' + d]); });
    ['L', 'R'].forEach(function (d) { add('wingFront' + d, sp['wingFront' + d]); });
    ['L', 'R'].forEach(function (d) { add('wingSpot' + d, sp['wingSpot' + d]); });

    /* the photograph itself */
    var img = XY.svgEl('image', {
      x: 0, y: 0, width: PH.w, height: PH.h,
      preserveAspectRatio: 'xMidYMid meet',
      'data-slot': 'photo',
    });
    img.setAttribute('href', opts.src);
    /* older WebKit still wants the xlink form */
    img.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', opts.src);
    nodes.photo = img;
    body.appendChild(img);

    /* the same tricorn the drawn crew wears, scaled onto her head */
    if (withHat && XY.Creature && XY.Creature.shapes) {
      var S = XY.Creature.shapes;
      var hatG = XY.svgEl('g', { class: 'hero-hat' });
      var hw = PH.headW * 0.52;
      var hx = PH.headCX + 4, hy = PH.headCY - PH.headW * 0.66;
      var mk = function (d, fill, stroke, op) {
        var p = XY.svgEl('path', { d: d, fill: fill, opacity: op === undefined ? 1 : op });
        if (stroke) {
          p.setAttribute('stroke', stroke);
          p.setAttribute('stroke-width', 5);
          p.setAttribute('stroke-linejoin', 'round');
          p.setAttribute('paint-order', 'stroke');
        }
        hatG.appendChild(p);
        return p;
      };
      /* the hat shapes are authored around a 200-unit creature; scale to fit */
      var k = hw / 60;
      var inner = XY.svgEl('g', {
        transform: 'translate(' + hx + ',' + hy + ') scale(' + k.toFixed(3) + ') translate(-100,-40)'
      });
      var mkI = function (d, fill, stroke, op) {
        var p = XY.svgEl('path', { d: d, fill: fill, opacity: op === undefined ? 1 : op });
        if (stroke) {
          p.setAttribute('stroke', stroke);
          p.setAttribute('stroke-width', 3);
          p.setAttribute('stroke-linejoin', 'round');
          p.setAttribute('paint-order', 'stroke');
        }
        inner.appendChild(p);
        return p;
      };
      mkI(S.plumePath(100 + 34, 40 - 6, 34), '#FF8FB1', INK);
      mkI(S.tricornPath(100, 40, 58), '#2A1B4A', '#0B1730');
      mkI(S.tricornTrim(100, 40, 58), '#FFD84D', null, 0.95);
      mkI(S.crossbones(100, 36, 15), '#FFF8EE');
      mkI(S.lemonPath(100, 36, 8.5), '#FFD84D', '#F0A500');
      hatG.appendChild(inner);
      nodes.hat = hatG;
      body.appendChild(hatG);
    }

    add('sparkles', sp.sparkles);

    root.appendChild(body);
    svg.appendChild(root);
    return {
      svg: svg, root: root, body: body, nodes: nodes, spec: sp,
      name: 'Captain Xyla', isPhoto: true,
    };
  }

  function animatePhoto(h) {
    var rand = XY.rng('xyla-photo-anim');
    /* she bobs as if hovering */
    gsap.to(h.body, {
      y: -14, duration: 2.4, repeat: -1, yoyo: true, ease: 'sine.inOut',
    });
    /* wings beat — slow and dreamy, not insect-fast */
    gsap.to([h.nodes.wingFrontL, h.nodes.wingBackL, h.nodes.wingSpotL], {
      scaleX: 0.82, rotation: 5, duration: 1.5, repeat: -1, yoyo: true,
      ease: 'sine.inOut', transformOrigin: PH.backCX + 'px ' + PH.backCY + 'px',
    });
    gsap.to([h.nodes.wingFrontR, h.nodes.wingBackR, h.nodes.wingSpotR], {
      scaleX: 0.82, rotation: -5, duration: 1.5, repeat: -1, yoyo: true,
      ease: 'sine.inOut', transformOrigin: PH.backCX + 'px ' + PH.backCY + 'px',
    });
    if (h.nodes.hat) {
      gsap.to(h.nodes.hat, {
        rotation: -3, duration: 3.1, repeat: -1, yoyo: true, ease: 'sine.inOut',
        transformOrigin: PH.headCX + 'px ' + PH.headCY + 'px',
      });
    }
    gsap.to(h.nodes.sparkles, {
      opacity: 0.35, scale: 1.06, duration: 2.2, repeat: -1, yoyo: true,
      ease: 'sine.inOut', transformOrigin: '50% 50%',
    });
  }

  XY.Hero = {
    spec: spec, render: render, animate: animate, SLOTS: SLOTS,
    renderPhoto: renderPhoto, animatePhoto: animatePhoto, PH: PH,
  };

})(window.XY = window.XY || {});

</script>
<script>
/* ============================================================================
 *  ufo.js — the flying saucer fleet
 *  ---------------------------------------------------------------------------
 *  Generated saucers with glassy domes, lit portholes, seeded liveries and
 *  tractor beams that can pick a creature up, change it, and set it back down.
 *
 *  The abduct-and-return cycle is the best toy on the page: a kid taps a UFO,
 *  it beams a creature up, and a different creature comes back down. It is also
 *  the clearest possible demonstration of the morph engine.
 *
 *  Glow is stacked translucent shapes, never an SVG blur filter — blur filters
 *  are the single worst source of jank on phones.
 * ==========================================================================*/
(function (XY) {
  'use strict';

  var path = XY.path;
  var uid = 0;

  var HULLS = [
    ['#C9A7F5', '#8E6BD1'], ['#9BE8C8', '#4FC79B'], ['#FFD84D', '#F0A500'],
    ['#FF8FB1', '#E8618A'], ['#A8D8FF', '#6FAEE8'], ['#FFB4A1', '#FF8B6B'],
  ];

  function genome(seed) {
    var rand = XY.rng(seed);
    var hull = rand.pick(HULLS);
    return {
      seed: seed, rand: rand,
      hull: hull[0], hullShade: hull[1],
      dome: rand.pick(['#BDE7F5', '#FFE9A8', '#F7C6E0', '#D9F5E8']),
      portholes: rand.int(5, 8),
      portColor: rand.pick(['#FFD84D', '#FF8FB1', '#9BE8C8', '#FFFFFF']),
      width: rand.range(0.85, 1.2),
      livery: rand.pick(['dots', 'stripe', 'scallop', 'plain']),
      beaconColor: rand.pick(['#FF8FB1', '#FFD84D', '#9BE8C8']),
    };
  }

  /* The drawing box is 0..200 wide, saucer centred at (100, 70). */
  function build(g) {
    var rand = XY.rng(g.seed + 11);
    var w = 78 * g.width;
    var parts = [];

    /* soft glow beneath — three stacked translucent ellipses */
    parts.push({ slot: 'glow', d: path.blob(100, 78, w * 1.25, 26, { points: 14, wobble: 0.03, rand: rand }),
                 fill: g.hull, opacity: 0.14 });

    /* under-hull */
    parts.push({ slot: 'hull', d: path.blob(100, 80, w * 0.82, 20, {
                   points: 14, wobble: 0.02, rand: rand,
                   shape: function (a) { return 1 + 0.18 * Math.sin(a); } }),
                 fill: g.hullShade, stroke: '#2A1B4A', opacity: 1 });

    /* main rim — the wide saucer disc */
    parts.push({ slot: 'rim', d: path.blob(100, 70, w, 17, { points: 14, wobble: 0.015, rand: rand }),
                 fill: g.hull, stroke: '#2A1B4A', opacity: 1 });

    /* glassy dome */
    parts.push({ slot: 'dome', d: path.blob(100, 52, w * 0.44, 26, {
                   points: 14, wobble: 0.02, rand: rand,
                   shape: function (a) { return 1 - 0.28 * Math.max(0, Math.sin(a)); } }),
                 fill: g.dome, stroke: '#2A1B4A', opacity: 1 });

    /* a highlight streak on the dome so it reads as glass, not plastic */
    parts.push({ slot: 'domeGlint', d: path.blob(100 - w * 0.16, 44, w * 0.11, 8,
                   { points: 14, wobble: 0, rotate: -0.5 }),
                 fill: '#FFFFFF', opacity: 0.55 });

    /* livery */
    if (g.livery === 'stripe') {
      parts.push({ slot: 'livery', d: path.roundRect(100, 70, w * 1.7, 5, 1),
                   fill: '#FFF8EE', opacity: 0.75 });
    } else if (g.livery === 'scallop') {
      parts.push({ slot: 'livery',
                   d: path.closedSpline(path.scallop(100 - w, 74, 100 + w, 74, 6, 4, false)
                        .concat([[100 + w, 68], [100, 66], [100 - w, 68]]), 0.7),
                   fill: '#FFF8EE', opacity: 0.6 });
    } else if (g.livery === 'dots') {
      var dots = [];
      for (var i = 0; i < 7; i++) {
        dots.push(path.blob(100 - w * 0.8 + (w * 1.6) * (i / 6), 62, 3.4, 3.4, { points: 14, wobble: 0 }));
      }
      parts.push({ slot: 'livery', d: dots.join(' '), fill: '#FFF8EE', opacity: 0.7 });
    }

    /* portholes, each its own node so they can light in sequence */
    var ports = [];
    for (var p = 0; p < g.portholes; p++) {
      var t = (p + 0.5) / g.portholes;
      var px = 100 + (t - 0.5) * 2 * w * 0.86;
      var py = 76 + Math.sin(t * Math.PI) * 3;
      ports.push({ slot: 'port' + p, d: path.blob(px, py, 5.2, 5.2, { points: 14, wobble: 0 }),
                   fill: g.portColor, stroke: '#2A1B4A', opacity: 1, port: true });
    }
    parts = parts.concat(ports);

    /* beacon on top */
    parts.push({ slot: 'beaconStalk', d: path.roundRect(100, 26, 3, 10, 1),
                 fill: '#2A1B4A', opacity: 1 });
    parts.push({ slot: 'beacon', d: path.blob(100, 21, 7, 7, { points: 14, wobble: 0 }),
                 fill: g.beaconColor, stroke: '#2A1B4A', opacity: 1 });

    return { parts: parts, w: w, portCount: g.portholes };
  }

  function render(g) {
    var built = build(g);
    var id = 'ufo' + (uid++);
    var svg = XY.svgEl('svg', {
      viewBox: '-20 0 240 320', class: 'ufo',
      'aria-hidden': 'true', focusable: 'false', overflow: 'visible'
    });

    /* gradient for the tractor beam — a def, not a filter */
    var defs = XY.svgEl('defs');
    var grad = XY.svgEl('linearGradient', { id: id + '-beam', x1: '0', y1: '0', x2: '0', y2: '1' });
    /* The tail must not fade to nothing. The beam is now stretched to reach
       its target, so a gradient that hits zero opacity at 100% made the last
       third invisible and the beam looked like it stopped short of the
       creature it was actually holding. */
    [['0%', 0.52], ['62%', 0.3], ['100%', 0.16]].forEach(function (s) {

       other's scaleY, which is the classic way a beam ends up flickering. */

       * close but always slightly off, because the host box knows nothing
       * about the transforms INSIDE the saucer: the root bobs by up to nine
       * units and the rig tilts by up to six degrees, both continuously. The
       * beam hangs off the rig, so its true mouth moves with them while the
       * computed one did not — a small, permanent, drifting offset.

         ON the creature rather than somewhere near it. */
      gsap.set(U.beam, {
        transformOrigin: '100px ' + U.beamY0 + 'px',
        rotation: -Math.atan2(dx, dy) * 180 / Math.PI,

 *  sky.js — the candy-sky visualizer

 *  a vertical pastel gradient, domain-warped cotton-cloud bands, a portal bloom

    'uniform float uPortal;',     // 0..1 how open the portal is
    'uniform vec3  uPalA;',       // top
    'uniform vec3  uPalB;',       // middle

    'uniform vec3  uAudio;',      // bass, mid, high — all gentle

    '  float v = 0.0, a = 0.5;',
    '  for (int i = 0; i < 5; i++){',
    '    if (float(i) >= uOctaves) break;',
    '    v += a * noise(p);',

     *  smeared ALONG it. `band` is the normalised distance through the arc's
     *  thickness — 0 at the inner edge, 1 at the outer — so quantising it
     *  into seven steps gives seven concentric stripes. Only the last 14% of
     *  each stripe ramps into the next, which keeps the bands flat and
     *  distinct while stopping them from aliasing into stairsteps on a phone.
     * ------------------------------------------------------------------*/

    '  float bq = b * 7.0;',

    '  return smoothstep(0.0, 0.09, band) * smoothstep(1.0, 0.91, band);',

    'void main(){',
    '  vec2 uv = gl_FragCoord.xy / uRes.xy;',
    '  vec2 p  = (gl_FragCoord.xy - 0.5 * uRes.xy) / min(uRes.x, uRes.y);',
    '  float t = uTime * 0.045;',

    '  col = mix(col, uPalA, smoothstep(0.45, 1.0, uv.y));',

    /* The rainbow is drawn BEFORE the clouds, so the clouds pass in front of
       it the way they do in the sky, instead of it being painted on top of
       everything like a sticker. */

    '  float bowFade = smoothstep(0.12, 0.5, uProgress);',
    '  float b1 = (rr - 0.58) / 0.19;',
    '  col = mix(col, bowColor(b1, 0.0), bowMask(b1) * 0.44 * bowFade);',
    /* the secondary bow — dimmer, wider, and its colours run the other way,

    '  float warp = 0.55 + 0.25 * uAudio.x;',

    '  col += max(halo, 0.0) * 0.18 * vec3(1.0, 0.8, 0.95) * uPortal;',

    '  col += starMask * tw * (0.55 + 0.35 * uAudio.z) * vec3(1.0, 0.98, 0.9);',

<script>
/* ============================================================================
 *  parallax.js — the multi-plane camera
 *  ---------------------------------------------------------------------------
 *  Seven layers, each with a depth factor. Pointer, device tilt, the story's
 *  camera moves and the shake impulses all push a single target; every layer
 *  follows it at its own rate.
 *
 *  This is a multi-plane rig, not a flat slide. Three things ride on `depth`:
 *
 *    - PAN.   Near layers slide further than far ones. (The original job.)
 *    - ZOOM.  Near layers *grow* more than far ones when the camera pushes in.
 *             That difference is the entire reason a push-in reads as depth
 *             rather than as everything scaling together like a photograph.
 *    - FOCUS. Centring on a subject moves near layers further than far ones,
 *             so the parallax stays consistent while the camera travels.
 *
 *  Four details that matter:
 *   - Damping is frame-rate independent. A plain lerp(a, b, 0.1) per frame moves
 *     twice as fast on a 120Hz phone as on a 60Hz laptop; the exponential form
 *     here behaves identically on both.
 *   - Exactly one transform write per layer per frame, from a single ticker.
 *     No layout properties are ever touched.
 *   - Zoom never goes below 1. `.layer` only bleeds 14% past the viewport, so
 *     pulling back further than the frame would slide a layer edge into shot.
 *   - The story writes `zoom`/`fx`/`fy` from a tweened proxy on the master

 * ==========================================================================*/

<script>
/* ============================================================================
 *  confetti.js — a small pooled particle system on a 2D canvas
 *  ---------------------------------------------------------------------------
 *  Pooled, so a confetti storm never allocates mid-animation. Shapes are drawn
 *  as simple rounded rectangles and circles with a spin, which reads as paper
 *  without costing anything. Disabled entirely on the low quality tier and
 *  under prefers-reduced-motion.
 * ==========================================================================*/
(function (XY) {
  'use strict';

  var COLORS = ['#FFD84D', '#FF8FB1', '#9BE8C8', '#7EC8E3', '#C9A7F5', '#FFF8EE', '#FF9F6B'];

  function Confetti(canvas, max) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.max = max || 160;
    this.pool = [];
    this.live = 0;
    this.dpr = 1;
    for (var i = 0; i < this.max; i++) {
      this.pool.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, rot: 0, vrot: 0,
                       size: 0, color: '#fff', life: 0, maxLife: 1, round: false });
    }

    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = Math.max(1, Math.round(this.canvas.clientWidth * this.dpr));
    this.canvas.height = Math.max(1, Math.round(this.canvas.clientHeight * this.dpr));
  };

  Confetti.prototype.burst = function (x, y, n, opts) {
    if (this.max === 0) return;
    opts = opts || {};
    var spread = opts.spread === undefined ? Math.PI * 2 : opts.spread;
    var dir = opts.direction === undefined ? -Math.PI / 2 : opts.direction;
    var power = opts.power || 1;
    for (var i = 0, made = 0; i < this.pool.length && made < n; i++) {
      var p = this.pool[i];
      if (p.on) continue;
      var a = dir + (Math.random() - 0.5) * spread;
      var sp = (2.2 + Math.random() * 4.4) * power;
      p.on = true; made++;
      p.x = x; p.y = y;
      p.vx = Math.cos(a) * sp;
      p.vy = Math.sin(a) * sp;
      p.rot = Math.random() * Math.PI * 2;
      p.vrot = (Math.random() - 0.5) * 0.32;
      p.size = 5 + Math.random() * 7;
      p.round = Math.random() < 0.35;
      p.color = opts.color || COLORS[(Math.random() * COLORS.length) | 0];
      p.maxLife = 1.6 + Math.random() * 1.6;
      p.life = p.maxLife;
      this.live++;

  };

  Confetti.prototype.update = function (dt) {
    if (this.live === 0) return;
    var ctx = this.ctx, d = this.dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    var h = this.canvas.height / d;
    var step = Math.min(dt, 0.05) * 60;   // clamp so a stalled tab doesn't teleport

      var p = this.pool[i];
      if (!p.on) continue;
      p.life -= dt;
      if (p.life <= 0) { p.on = false; this.live--; continue; }
      p.vy += 0.16 * step;                // gravity
      p.vx *= 0.995;
      p.x += p.vx * step;
      p.y += p.vy * step;
      p.rot += p.vrot * step;

<script>
/* ============================================================================
 *  audio.js — a music box, generated
 *  ---------------------------------------------------------------------------
 *  No audio files. Every note is synthesised: a triangle plus a sine an octave
 *  up, through a fast decay envelope and a lowpass, into a gentle delay. That
 *  combination is the classic music-box/celesta timbre.
 *
 *  The tune is an ORIGINAL 8-bar loop in C major pentatonic. Pentatonic is a
 *  deliberate choice: every note a child triggers by poking a creature is
 *  guaranteed to be consonant with whatever the bed is playing, so the page can
 *  never make an ugly sound. It is deliberately not "Happy Birthday To You",
 *  which is somebody else's song.
 *
 *  Audio starts OFF and the context is only created inside a real user gesture,
 *  which is both polite and required by mobile browsers.
 * ==========================================================================*/
(function (XY) {
  'use strict';

  /* C major pentatonic across two octaves; index 0 = C4 */
  var SCALE = [261.63, 293.66, 329.63, 392.00, 440.00,
               523.25, 587.33, 659.25, 783.99, 880.00];

  /* An original melody, written as scale degrees. -1 is a rest.
     8 bars of 8 eighth-notes. Lilting, simple, a bit pleased with itself. */
  var MELODY = [
    5, -1, 4, 5, 7, -1, 5, -1,
    4, -1, 3, 4, 5, -1, 3, -1,
    2, 3, 4, -1, 5, 4, 3, -1,
    0, 2, 4, 5, 4, -1, 2, -1,
    5, -1, 7, 8, 9, -1, 8, -1,
    7, -1, 5, 7, 8, -1, 5, -1,
    4, 5, 7, -1, 8, 7, 5, -1,
    4, 2, 4, 5, 3, -1, 0, -1,
  ];
  /* A slow bass pulse underneath, one note per bar. */
  var BASS = [0, 3, 1, 4, 0, 3, 2, 0];

  function Audio(opts) {
    opts = opts || {};
    this.ctx = null;
    this.on = false;
    this.ready = false;
    this.bpm = 108;
    this.step = 0;
    this.nextTime = 0;
    this.timer = null;
    this.bands = [0, 0, 0];
    this.onNote = opts.onNote || null;
  }

  /* Must be called from a user gesture. */
  Audio.prototype.init = function () {
    if (this.ctx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { this.ctx = new AC(); } catch (e) { return false; }

    var ctx = this.ctx;
    this.master = ctx.createGain();
    this.master.gain.value = 0;              // silent until unmuted
    this.master.connect(ctx.destination);

    /* a soft shelf so nothing is harsh on phone speakers */
    this.tone = ctx.createBiquadFilter();
    this.tone.type = 'lowpass';
    this.tone.frequency.value = 4200;
    this.tone.connect(this.master);

    /* a short feedback delay gives the music box its room */
    this.delay = ctx.createDelay(1.0);
    this.delay.delayTime.value = 0.28;
    this.fb = ctx.createGain();
    this.fb.gain.value = 0.26;
    this.wet = ctx.createGain();
    this.wet.gain.value = 0.34;
    this.delay.connect(this.fb); this.fb.connect(this.delay);
    this.delay.connect(this.wet); this.wet.connect(this.tone);

    this.analyser = ctx.createAnalyser();
    this.analyser.fftSize = 256;
    this.analyser.smoothingTimeConstant = 0.8;
    this.master.connect(this.analyser);
    this.freq = new Uint8Array(this.analyser.frequencyBinCount);

    this.ready = true;
    return true;
  };

  Audio.prototype.voice = function (freq, time, dur, gain, bright) {
    var ctx = this.ctx;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(gain, time + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);

    var o1 = ctx.createOscillator();
    o1.type = 'triangle';
    o1.frequency.setValueAtTime(freq, time);

    var o2 = ctx.createOscillator();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(freq * 2, time);
    var g2 = ctx.createGain();
    g2.gain.value = (bright === undefined ? 0.35 : bright);
    o2.connect(g2); g2.connect(g);

    o1.connect(g);
    g.connect(this.tone);
    g.connect(this.delay);

    o1.start(time); o2.start(time);
    o1.stop(time + dur + 0.05); o2.stop(time + dur + 0.05);
  };

    if (on) this.start();

     from the scale, so it can never clash with the music. */
  Audio.prototype.blip = function (degree) {
    if (!this.ready || !this.on) return;

  /* Three smoothed bands for the visualizer. */
  Audio.prototype.sample = function (dt) {
    if (!this.ready || !this.on) {
      this.bands[0] = XY.damp(this.bands[0], 0, 3, dt);
      this.bands[1] = XY.damp(this.bands[1], 0, 3, dt);
      this.bands[2] = XY.damp(this.bands[2], 0, 3, dt);

    this.analyser.getByteFrequencyData(this.freq);
    var n = this.freq.length, i, sum;
    var edges = [[0, n * 0.12], [n * 0.12, n * 0.45], [n * 0.45, n]];

      var lo = Math.floor(edges[b][0]), hi = Math.floor(edges[b][1]);

      var v = (sum / Math.max(1, hi - lo)) / 255;
      this.bands[b] = XY.damp(this.bands[b], v, 6, dt);
    }
    return this.bands;
  };

  XY.Audio = Audio;
  XY.SCALE_LEN = SCALE.length;

})(window.XY = window.XY || {});

</script>
<script>
/* ============================================================================
 *  invite.js — the invitation card, the RSVP, and the calendar file
 *  ---------------------------------------------------------------------------
 *  Everything above this file is spectacle. This file is the actual job: tell
 *  people when and where the party is, and get a reply back to Mom.
 *
 *  So it is built to different standards than the rest of the page:
 *   - Real semantic HTML. Selectable, zoomable, screen-reader friendly.
 *   - Never text over the shader. The card is a near-opaque light surface.
 *   - 16px minimum on inputs, because below that iOS Safari zooms on focus and
 *     wrecks the layout.

 * ==========================================================================*/

     deliberately unfilled rather than looking like a bug. */

             '<dd>' + value + '</dd>' +

    var when = XY.esc(p.dateDisplay) +
      (p.timeDisplay ? '<span class="dot">·</span>' + XY.esc(p.timeDisplay) : '');
    var where = XY.esc(p.venue) +
      (p.address ? '<span class="sub">' + XY.esc(p.address) + '</span>' : '');

    var medallion = (C.PHOTOS && C.PHOTOS.medallion)
      ? '<div class="medallion"><img src="' + XY.esc(C.PHOTOS.medallion) +
        '" alt="Xyla, wearing enormous sunglasses" width="420" height="420" decoding="async"></div>'
      : '';

      '<div class="card-deco" aria-hidden="true"></div>' +
      medallion +
      '<p class="eyebrow">You are invited to</p>' +
      '<h1 class="title">' + XY.esc(child.name) + '’s <em>' + child.age + 'rd</em> Birthday</h1>' +
      '<p class="lede">A butterfly-pirate-robot-dinosaur <strong>pool party</strong>, ' +

      '<dl class="details">' +
        fieldRow('When', when, 'row-when') +
        fieldRow('Where', where, 'row-where') +
        fieldRow('Bring', XY.esc(p.bring)) +

      '<h2 class="rsvp-title">Are you coming?</h2>' +
      '<p class="rsvp-sub">Replies go straight to ' + XY.esc(to) + '.</p>' +
      '<form novalidate autocomplete="on">' +
        '<div class="field">' +
          '<label for="rsvp-name">Your name</label>' +
          '<input id="rsvp-name" name="name" type="text" maxlength="60" required ' +
            'autocomplete="name" aria-describedby="err-name">' +
          '<span class="err" id="err-name"></span>' +
        '</div>' +
        '<div class="field-pair">' +

            '<label for="rsvp-kids">Kids</label>' +

              'min="0" max="20" step="1" value="1" aria-describedby="err-kids">' +
            '<span class="err" id="err-kids"></span>' +
          '</div>' +
          '<div class="field">' +

              'min="0" max="20" step="1" value="1" aria-describedby="err-adults">' +

        '</div>' +
        '<div class="field">' +
          '<label for="rsvp-note">Anything we should know? <span class="opt">(optional)</span></label>' +
