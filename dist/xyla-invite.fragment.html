<title>Xyla is turning 3 — you’re invited</title>
<script>window.XY_STANDALONE=true;</script>
<style>
/* ============================================================================
 *  style.css — Lemonade Voyage
 *  Palette taken from a photo of Xyla at the beach: lemon-print swimsuit
 *  (yellow, teal leaves, blush flowers, near-white lilac), sand, and sea sky.
 * ==========================================================================*/

:root {
  --lemon:      #FFD84D;
  --lemon-deep: #F0A500;
  --leaf:       #0E7C7B;
  --blossom:    #FF8FB1;
  --blossom-deep:#E8618A;
  --lilac:      #EDE7FB;
  --sky:        #7EC8E3;
  --sand:       #F6E3C5;
  --deepsea:    #14284B;
  --ink:        #2A1B4A;
  --cream:      #FFF8EE;
  --grape:      #8E6BD1;
  --mint:       #9BE8C8;

  --card:       #FFFCF6;
  --card-edge:  rgba(42, 27, 74, 0.12);
  --shadow:     0 18px 44px rgba(42, 27, 74, 0.20), 0 3px 10px rgba(42, 27, 74, 0.10);
  --radius:     26px;

  /* ui-rounded gives iOS a perfect soft face for free, with no web font and
     no network request. The rest is a careful fallback chain. */
  --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Varela Round",
          Nunito, "Segoe UI Variable", system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

/* The `hidden` attribute must win. Any element given `display: grid/flex` in a
   rule below would otherwise ignore it — which silently leaves the gate
   covering the whole page. */
[hidden] { display: none !important; }

html { background: #7EC8E3; }

html, body {
  margin: 0; padding: 0;
  height: 100%;
  overscroll-behavior: none;
}

body {
  font-family: var(--font);
  color: var(--ink);
  background: linear-gradient(180deg, #FFE9A8 0%, #FFD1DC 55%, var(--sky) 100%);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  overflow: hidden;
}

body.is-scrollable { overflow: auto; }

/* ============================ THE STAGE =================================== */

#stage {
  position: fixed;
  inset: 0;
  height: 100dvh;
  overflow: hidden;
  z-index: 0;
}

.layer {
  position: absolute;
  inset: -8%;                 /* bleed, so parallax never exposes an edge */
  pointer-events: none;
  contain: layout paint;
  backface-visibility: hidden;
}

#l-sky      { inset: 0; }
#l-sky canvas { width: 100%; height: 100%; display: block; }
#l-far, #l-mid, #l-fleet, #l-cast, #l-fore { }
#l-fore canvas { width: 100%; height: 100%; display: block; }

/* Creatures and saucers are positioned by percentage and sized in vmin so the
   whole composition scales sensibly from a phone to a desktop. */
.actor {
  position: absolute;
  width: 22vmin;
  transform-origin: 50% 100%;
  will-change: transform;
}
.actor > svg { width: 100%; height: auto; display: block; overflow: visible; }
.actor.is-tappable { pointer-events: auto; cursor: pointer; }
.actor .hit { fill: transparent; }

.actor-ufo { width: 30vmin; }
.actor-hero { width: 30vmin; }

/* The giant "3" sits behind Captain Xyla at the reveal. */
.bigthree {
  position: absolute;
  left: 50%; top: 20%;
  width: 34vmin;
  z-index: 80;
  opacity: 0;
  pointer-events: none;
}
.bigthree svg { width: 100%; height: auto; display: block; overflow: visible; }

@media (max-width: 620px) {
  .actor { width: 30vmin; }
  .actor-ufo { width: 38vmin; }
  .actor-hero { width: 42vmin; }
}

/* ============================ UI CHROME =================================== */

#ui {
  position: relative;
  z-index: 10;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  pointer-events: none;
}
#ui > * { pointer-events: auto; }

.skip-link {
  position: absolute;
  left: 12px; top: -60px;
  background: var(--card); color: var(--ink);
  padding: 10px 16px; border-radius: 12px;
  z-index: 60; font-weight: 700;
  transition: top .15s ease;
}
.skip-link:focus { top: 12px; }

/* ---- top bar ---- */
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
           12px max(12px, env(safe-area-inset-left));
}

.brandmark {
  font-weight: 800; font-size: 15px; letter-spacing: .01em;
  color: var(--ink);
  background: rgba(255, 252, 246, .82);
  padding: 8px 14px; border-radius: 999px;
  box-shadow: 0 2px 10px rgba(42,27,74,.12);
}

.topbar-actions { display: flex; gap: 8px; }

/* ---- buttons ---- */
.btn {
  font: inherit; font-weight: 700;
  border: none; cursor: pointer;
  border-radius: 999px;
  padding: 12px 20px;
  min-height: 44px;                /* thumb-sized, always */
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.btn:active { transform: translateY(1px) scale(.98); }

.btn-primary {
  background: linear-gradient(180deg, var(--lemon) 0%, var(--lemon-deep) 130%);
  color: #4A2E00;
  box-shadow: 0 4px 0 #C98A00, 0 10px 22px rgba(240,165,0,.34);
}
.btn-primary:hover { background: linear-gradient(180deg, #FFE070 0%, var(--lemon-deep) 130%); }

.btn-ghost {
  background: rgba(255, 252, 246, .9);
  color: var(--ink);
  box-shadow: 0 2px 10px rgba(42,27,74,.14);
}
.btn-ghost:hover { background: #fff; }

.btn-big { width: 100%; font-size: 17px; padding: 15px 20px; }

.btn-icon {
  width: 46px; height: 46px; padding: 0;
  display: grid; place-items: center;
  font-size: 18px; line-height: 1;
  background: rgba(255, 252, 246, .9);
  color: var(--ink);
  box-shadow: 0 2px 10px rgba(42,27,74,.14);
}
.btn-icon[aria-pressed="true"] { background: var(--lemon); }

:where(button, a, input, textarea):focus-visible {
  outline: 3px solid var(--grape);
  outline-offset: 3px;
}

/* ---- storybook title, act 0 ---- */
.storytitle {
  margin: auto;
  text-align: center;
  padding: 0 24px;
  max-width: 22ch;
}
.storytitle .kicker {
  font-size: clamp(13px, 3vw, 17px);
  letter-spacing: .22em; text-transform: uppercase;
  font-weight: 800;
  color: var(--ink); opacity: .7;
  margin: 0 0 .6em;
}
.storytitle h1 {
  margin: 0;
  font-size: clamp(38px, 12vw, 104px);
  line-height: .94;
  font-weight: 900;
  letter-spacing: -.02em;
  color: var(--lemon);
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 6px 0 rgba(42,27,74,.22);
}
.storytitle .sub {
  margin: .7em 0 0;
  font-size: clamp(15px, 4vw, 22px);
  font-weight: 700;
  color: var(--ink);
}

/* ---- bottom controls ---- */
.controls {
  margin-top: auto;
  display: flex; align-items: center; justify-content: center;
  gap: 10px; flex-wrap: wrap;
  padding: 12px max(12px, env(safe-area-inset-right))
           max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}

.chapters { display: flex; gap: 7px; align-items: center; }
.chapter-dot {
  width: 13px; height: 13px; padding: 0;
  border-radius: 999px; border: 2px solid var(--ink);
  background: rgba(255,252,246,.75);
  cursor: pointer;
  transition: transform .16s ease, background .16s ease;
}
.chapter-dot[aria-current="true"] { background: var(--lemon); transform: scale(1.42); }
/* the tap target is bigger than the dot */
.chapter-dot::before { content:''; position:absolute; inset:-14px; }
.chapter-dot { position: relative; }

.scrubber {
  -webkit-appearance: none; appearance: none;
  width: min(320px, 46vw); height: 26px;
  background: transparent; cursor: pointer;
}
.scrubber::-webkit-slider-runnable-track {
  height: 8px; border-radius: 999px;
  background: rgba(255,252,246,.75);
  box-shadow: inset 0 1px 3px rgba(42,27,74,.2);
}
.scrubber::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 24px; height: 24px; margin-top: -8px;
  border-radius: 999px; background: var(--lemon);
  border: 3px solid var(--ink);
}
.scrubber::-moz-range-track {
  height: 8px; border-radius: 999px; background: rgba(255,252,246,.75);
}
.scrubber::-moz-range-thumb {
  width: 24px; height: 24px; border-radius: 999px;
  background: var(--lemon); border: 3px solid var(--ink);
}

/* ============================ THE CARD =================================== */

#sheet {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
  overflow-y: auto;
  overscroll-behavior: contain;
  background: rgba(20, 40, 75, .34);
  opacity: 0;
  visibility: hidden;
}
#sheet.is-open { opacity: 1; visibility: visible; }

.sheet-inner {
  width: min(560px, 100%);
  margin: auto;
  display: grid;
  gap: 14px;
}

.card {
  position: relative;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: clamp(22px, 5vw, 34px);
  border: 1px solid var(--card-edge);
}

.card-deco {
  position: absolute; inset: 9px;
  border-radius: calc(var(--radius) - 8px);
  border: 2.5px dashed rgba(240, 165, 0, .5);
  pointer-events: none;
}

.eyebrow {
  margin: 0 0 6px;
  font-size: 13px; font-weight: 800;
  letter-spacing: .2em; text-transform: uppercase;
  color: var(--leaf);
}

.card .title {
  margin: 0 0 10px;
  font-size: clamp(28px, 7.5vw, 42px);
  line-height: 1.02;
  font-weight: 900;
  letter-spacing: -.02em;
}
.card .title em {
  font-style: normal;
  color: var(--lemon-deep);
}

.lede {
  margin: 0 0 18px;
  font-size: clamp(15px, 4vw, 17px);
  line-height: 1.45;
  color: #4A3A6B;
}

.details { margin: 0 0 20px; display: grid; gap: 2px; }
.details .row {
  display: grid;
  grid-template-columns: 78px 1fr;
  gap: 12px;
  align-items: baseline;
  padding: 11px 0;
  border-top: 1px solid rgba(42,27,74,.09);
}
.details .row:last-child { border-bottom: 1px solid rgba(42,27,74,.09); }
.details dt {
  margin: 0;
  font-size: 12px; font-weight: 800;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--leaf);
}
.details dd {
  margin: 0;
  font-size: clamp(16px, 4.2vw, 19px);
  font-weight: 700;
  line-height: 1.32;
}
.details .row-when dd { font-size: clamp(18px, 5vw, 22px); }
.details .sub {
  display: block;
  font-size: 15px; font-weight: 600;
  color: #5B4B7A;
  margin-top: 3px;
}
.details .dot { margin: 0 .5em; color: var(--lemon-deep); }

/* Unfilled placeholders look deliberate, not broken. */
.details .is-placeholder dd {
  color: #8A7BA8;
  background: repeating-linear-gradient(-45deg,
    rgba(142,107,209,.09) 0 8px, rgba(142,107,209,.16) 8px 16px);
  border-radius: 8px;
  padding: 2px 9px;
  display: inline-block;
}

.card-actions { display: flex; flex-wrap: wrap; gap: 9px; }
.status { margin: 12px 0 0; font-size: 14px; font-weight: 700; color: var(--leaf); min-height: 1.2em; }

/* ---- the RSVP panel ---- */
.rsvp { }
.rsvp-title { margin: 0 0 4px; font-size: clamp(21px, 5.5vw, 26px); font-weight: 900; }
.rsvp-sub { margin: 0 0 18px; font-size: 15px; color: #5B4B7A; }

.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field label { font-size: 14px; font-weight: 800; }
.field .opt { font-weight: 600; color: #7A6B96; }

.field input, .field textarea {
  font: inherit;
  font-size: 16px;                 /* below 16px iOS zooms on focus */
  padding: 13px 14px;
  min-height: 48px;
  border-radius: 14px;
  border: 2px solid rgba(42,27,74,.16);
  background: #fff;
  color: var(--ink);
  width: 100%;
}
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field textarea:focus { border-color: var(--grape); }
.field.has-error input, .field.has-error textarea { border-color: var(--blossom-deep); }

.err { font-size: 13px; font-weight: 700; color: #C33C68; min-height: 1em; }
.rsvp-status { margin: 12px 0 0; font-size: 15px; font-weight: 700; color: var(--leaf); }
.rsvp-alt { margin: 14px 0 0; font-size: 14px; color: #5B4B7A; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

.sheet-close {
  position: sticky; top: 0;
  justify-self: end;
  z-index: 2;
}

/* ---- success state ---- */
.thanks { text-align: center; }
.thanks h2 { margin: 0 0 8px; font-size: clamp(24px, 6vw, 32px); font-weight: 900; }
.thanks p { margin: 0 0 6px; font-size: 16px; color: #4A3A6B; }
.thanks .mailto-fallback {
  margin-top: 14px; font-size: 14px;
  word-break: break-word;
}
.thanks a { color: var(--grape); font-weight: 800; }

/* ============================ GATE ======================================= */

#gate {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  background: linear-gradient(180deg, #FFE9A8 0%, #FFD1DC 60%, var(--sky) 100%);
  text-align: center;
  padding: 24px;
}
#gate .gate-inner { display: grid; gap: 20px; justify-items: center; }
#gate p { margin: 0; font-size: 16px; font-weight: 700; color: #4A3A6B; }

/* ============================ NO-JS / FALLBACK =========================== */

.noscript-card {
  position: relative; z-index: 40;
  max-width: 560px; margin: 40px auto;
}

/* ============================ REDUCED MOTION ============================= */

@media (prefers-reduced-motion: reduce) {
  .layer { transition: none !important; }
}

body.calm .actor { animation: none !important; }

</style>

<script>
/* ============================================================================
 *  ✦  THE ONLY FILE YOU NEED TO EDIT  ✦
 *
 *  Change the lines below and the whole invitation updates itself.
 *  Every placeholder reads like "Date here" on purpose — you can share a draft
 *  right now and it will still look deliberate, not broken.
 * ==========================================================================*/
window.XY = window.XY || {};

window.XY.CONFIG = {

  /* ---- The birthday girl ----------------------------------------------- */
  CHILD: {
    name: 'Xyla',
    age: 3,
    title: 'Captain of the Lemon Sea',   // shown under the storybook title
  },

  /* ---- The party -------------------------------------------------------- */
  PARTY: {
    dateDisplay: 'Date here',            // e.g. 'Saturday, September 13th'
    timeDisplay: 'Time here',            // e.g. '11:00am – 2:00pm'
    venue: 'Place here',                 // e.g. 'The Big Backyard'
    address: 'Address here',             // e.g. '12 Lemon Grove Ln, Somewhere'
    bring: 'What to bring here',         // e.g. 'A swimsuit and a towel'
    notes: 'Notes here',                 // e.g. 'Wear something you can get sandy in'
    rsvpByDisplay: 'RSVP by date here',  // e.g. 'RSVP by September 1st'

    /* For the "Add to calendar" button. Leave both null and the button
       politely hides itself until you know the real date.
       Format: 'YYYY-MM-DDTHH:MM'  (local time, no timezone, no Z)          */
    startISO: null,                      // e.g. '2026-09-13T11:00'
    endISO: null,                        // e.g. '2026-09-13T14:00'
  },

  /* ---- RSVP: how replies reach Mom -------------------------------------- */
  RSVP: {
    /* REQUIRED — where RSVPs go. */
    to: 'mom@example.com',
    toName: 'Mom',
    subject: "RSVP: Xyla's 3rd Birthday",

    /* 'mailto'  → opens the guest's mail app pre-filled. Works instantly,
     *             no account, nothing that can break before the party.
     * 'post'    → sends silently in the background; guest never leaves.
     *             Requires `endpoint` below.                                */
    mode: 'mailto',

    /* Only used when mode is 'post'. Free options, pick one:
     *   Formspree   https://formspree.io/f/xxxxxxxx
     *   FormSubmit  https://formsubmit.co/ajax/mom@example.com
     * If the send ever fails it falls back to mailto automatically.
     * NOTE: the single-file build always uses mailto, because the page is
     * sandboxed there and cannot reach outside servers.                     */
    endpoint: '',

    /* Optional "or just text us" line. Set to '' to hide. */
    phone: '',
  },

  /* ---- Look and feel ----------------------------------------------------
   * seed      : change this string to reroll the whole cast of creatures.
   *             Find a cast you love, then keep the seed forever.
   * castSize  : how many creatures live on the stage (auto-reduced on phones)
   * fleetSize : how many UFOs
   * audioOn   : music ALWAYS starts off; this only decides if the button shows
   * quality   : null = detect automatically. Or force 'low' | 'med' | 'high'  */
  THEME: {
    seed: 'xyla-3',
    castSize: 9,
    fleetSize: 5,
  },

  FLAGS: {
    audioButton: true,
    tiltEnabled: true,
    secretPartyMode: true,
    forceQuality: null,
  },
};

<script>
/* ============================================================================
 *  core.js — seeded randomness, math, and the path kit
 *  ---------------------------------------------------------------------------
 *  Every shape in this project is generated from numbers. Nothing is traced,
 *  nothing is loaded from a file, nothing is copied from anyone's artwork.
 *  Two properties matter above all else:
 *
 *   1. Randomness is SEEDED — "the cute one" stays the cute one on every
 *      reload, on every phone, forever.
 *   2. Shapes are built from smooth closed splines with a canonical starting
 *      landmark, so any part can morph into any other part cleanly.
 * ==========================================================================*/

  /* ======================================================================
   *  Seeded PRNG (mulberry32) — tiny, fast, deterministic
   * ==================================================================== */

 *  swimsuit (yellow, teal leaves, blush flowers, near-white lilac ground),

 *  not like a generic party template.

    lemonDeep: '#F0A500',

    blossom:   '#FF8FB1',

    lilac:     '#EDE7FB',

    skyDeep:   '#4EA3C6',

    deepsea:   '#14284B',
    ink:       '#2A1B4A',
    cream:     '#FFF8EE',
    grape:     '#8E6BD1',
    mint:      '#9BE8C8',
    coral:     '#FF9F6B',

     [main, shadow, accent] and every one of them sits happily beside the
     lemon/teal/blush core above. */
  var SKINS = [
    ['#FFD84D', '#F0A500', '#FF8FB1'],   // lemon
    ['#FF8FB1', '#E8618A', '#FFD84D'],   // blossom
    ['#9BE8C8', '#4FC79B', '#FF8FB1'],   // mint
    ['#7EC8E3', '#4EA3C6', '#FFD84D'],   // sky
    ['#C9A7F5', '#8E6BD1', '#9BE8C8'],   // grape
    ['#FFB4A1', '#FF8B6B', '#7EC8E3'],   // coral
    ['#28A8A0', '#0E7C7B', '#FFD84D'],   // teal
    ['#FFE9A8', '#F5C24B', '#C9A7F5'],   // buttermilk
    ['#F7C6E0', '#E294C4', '#9BE8C8'],   // cotton candy

    sea:     ['#BDE7F5', '#7EC8E3', '#F6E3C5'],
    morph:   ['#FFD1DC', '#C9A7F5', '#7EC8E3'],

<script>
/* ============================================================================
 *  creature.js — the generative cast
 *  ---------------------------------------------------------------------------
 *  Butterfly-pirates. Robo-dinos. Dino-butterflies with jetpacks. Every one of
 *  them is built from numbers at runtime, from an original parametric design.
 *
 *  ARCHITECTURE — two ideas carry the whole system:
 *
 *  1. FIXED SLOT ROSTER. Every creature has every slot, always, in the same
 *     order. A creature with no tail still has a `tail` slot — collapsed to a
 *     dot at its anchor with opacity 0. That means any creature can morph into
 *     any other creature with no "what does this part become?" logic at all.
 *
 *  2. GENOME -> PURE SPEC -> DOM. `spec(genome)` returns plain data: a map of
 *     slot -> {d, fill, opacity, ...}. Rendering builds DOM from a spec, and
 *     morphing simply tweens from one spec to another. Because a spec is pure
 *     data, the morph target can be computed without touching the page.
 *
 *  Cuteness is not an accident here, it is a set of rules: head larger than
 *  body, eyes huge and set low on the face (like a baby's), limbs short,
 *  everything round, cheeks always rosy, and a soft ink outline rather than
 *  black. Those constants live in GEO below.
 * ==========================================================================*/
(function (XY) {
  'use strict';

  var path = XY.path, lerp = XY.lerp, TAU = XY.TAU;

  /* ---- The cute-making constants (viewBox is 0 0 200 200) --------------- */
  var GEO = {
    groundY: 184,
    bodyCX: 100, bodyCY: 134, bodyRX: 33, bodyRY: 29,
    headCX: 100, headCY: 78,  headRX: 42, headRY: 39,
    eyeCY: 84, eyeDX: 17.5, eyeR: 12.5,   // low + wide + huge = baby face
    cheekCY: 100, cheekDX: 30, cheekR: 8,
    mouthCY: 103,
  };

  var KITS = ['butterfly', 'pirate', 'robot', 'dino'];

  /* The slot roster, back to front. Order here IS z-order.
     Note both wing pairs sit behind the body: "front/back" means forewing and
     hindwing, as on a real butterfly — not foreground and background. */
  var SLOTS = [
    'glow',
    'wingBackL', 'wingBackR',
    'wingFrontL', 'wingFrontR',
    'wingSpotL', 'wingSpotR',
    'tail',
    'legL', 'legR',
    'body', 'belly',
    'armL', 'armR',
    'chestPlate',
    'head', 'snout',
    'crest',
    'hornL', 'hornR',
    'earL', 'earR',
    'eyeWhiteL', 'eyeWhiteR', 'pupilL', 'pupilR', 'glintL', 'glintR',
    'patch', 'shades',
    'cheekL', 'cheekR',
    'mouth',
    'hatPlume', 'hat', 'hatTrim', 'hatEmblem', 'hatBadge',
    'antennaL', 'antennaR', 'antennaBallL', 'antennaBallR',
    'accessory',

  /* ======================================================================
   *  GENOME — a creature's DNA. Seeded, so it is reproducible forever.
   * ==================================================================== */

    opts = opts || {};
    var rand = XY.rng(seed);
    var kits = opts.kits || rand.sample(KITS, rand.chance(0.22) ? 3 : 2);
    var has = {};
    KITS.forEach(function (k) { has[k] = kits.indexOf(k) >= 0; });

    var skin = XY.skinFor(rand);
    // Robots lean metallic-but-candy; dinos lean saturated.
    if (has.robot && rand.chance(0.5)) skin.main = XY.mixHex(skin.main, '#DDE9F5', 0.35);

      seed: seed,
      kits: kits, has: has,
      skin: skin,
      // Proportions — kept inside cute bounds. No creature is ever gangly.
      chub: rand.range(0.9, 1.16),
      headScale: rand.range(0.95, 1.12),
      eyeScale: rand.range(0.92, 1.14),
      squint: rand.range(0, 0.18),
      limbLen: rand.range(0.85, 1.15),
      // Kit specifics
      wingSpan: rand.range(0.9, 1.3),
      wingTilt: rand.range(-0.32, -0.05),
      wingPattern: rand.pick(['dots', 'lemon', 'stripes', 'hearts']),
      tailCurl: rand.range(-26, 26),
      tailLen: rand.range(0.85, 1.25),
      spikeCount: rand.int(3, 6),
      hornStyle: rand.pick(['horn', 'frill', 'none']),
      hatStyle: has.pirate ? rand.pick(['tricorn', 'bandana', 'tricorn']) : 'none',
      plumeLen: rand.range(26, 40),
      plumeColor: rand.pick(['#FF8FB1', '#FFD84D', '#9BE8C8', '#FFF8EE', '#FF9F6B']),
      bandanaColor: rand.pick(['#FF8FB1', '#E8618A', '#7EC8E3', '#FFD84D', '#C9A7F5']),
      eyePatch: has.pirate && rand.chance(0.55),
      shades: rand.chance(has.pirate ? 0.3 : 0.16),
      antenna: has.robot || has.butterfly,
      antennaCount: has.butterfly || rand.chance(0.35) ? 2 : 1,
      chestPlate: has.robot,

      belly: rand.chance(0.75),
      bellyStripes: has.pirate && rand.chance(0.5),
      accessory: rand.chance(0.5)

    else if (rand.chance(0.35)) t = rand.pick(['Professor', 'Sir', 'Queen', 'Little', 'Chief', 'Doctor']) + ' ';

        s['wingBack' + side] = {
          d: path.limb(ax, ay + 14, 52 * span, dnAng, 11 * span, dir * -11,
                       { taper: 1.95, bulge: 0.5, steps: 11 }),
          fill: XY.mixHex(skin.accent, '#FFFFFF', 0.34), stroke: skin.ink, opacity: 0.97

          }
        }
        s['wingSpot' + side] = {
          d: spots.join(' '),
          fill: g.wingPattern === 'lemon' ? '#FFD84D' : XY.mixHex(skin.shadow, '#FFFFFF', 0.15),
          opacity: 0.85
        };
      });
    } else if (g.has.robot) {
      /* jetpack fins instead of wings — still the wing slots, so a butterfly
         can morph its wings straight into a jetpack. */
      ['L', 'R'].forEach(function (side) {
        var dir = side === 'L' ? -1 : 1;
        s['wingBack' + side] = {
          d: path.limb(GEO.bodyCX + dir * 16, GEO.bodyCY - 4, 30, dir > 0 ? 0.9 : Math.PI - 0.9,
                       13, dir * 6, { taper: 0.5, steps: 9 }),
          fill: skin.shadow, stroke: skin.ink, opacity: 1
        };
      });
    }

    /* ---- HEAD ---------------------------------------------------------- */
    s.head = {
      d: g.has.robot && !g.has.butterfly
        ? path.roundRect(GEO.headCX, GEO.headCY, hRX * 1.85, hRY * 1.8, 0.5)
        : path.blob(GEO.headCX, GEO.headCY, hRX, hRY, { rand: rand, wobble: 0.03,
            shape: function (a) { return 1 + 0.06 * Math.sin(a); } }),
      fill: skin.main, stroke: skin.ink, opacity: 1
    };

    /* dino snout */
    if (g.has.dino) {
      s.snout = {
        d: path.blob(GEO.headCX, GEO.headCY + 16, hRX * 0.52, hRY * 0.36,
                     { rand: rand, wobble: 0.03 }),
        fill: XY.mixHex(skin.main, '#FFFFFF', 0.3), stroke: skin.ink, opacity: 1
      };
    }

    /* ---- CREST: dino spikes / butterfly antennae base / robot ridge ----- */
    if (g.has.dino) {
      var n = g.spikeCount, sp = [];
      for (var i = 0; i < n; i++) {
        var t = i / (n - 1);
        var ang = -Math.PI / 2 + lerp(-0.75, 0.75, t);
        var cx = GEO.headCX + Math.cos(ang) * hRX * 0.9;
        var cy = GEO.headCY + Math.sin(ang) * hRY * 0.9;
        sp.push(path.limb(cx, cy, 15 + Math.sin(t * Math.PI) * 9, ang, 6.5, 0,
                          { taper: 0.05, steps: 6 }));
      }
      s.crest = { d: sp.join(' '), fill: skin.accent, stroke: skin.ink, opacity: 1 };
    }

    /* ---- HORNS / FRILL ------------------------------------------------- */
    if (g.hornStyle === 'horn') {
      ['L', 'R'].forEach(function (side) {
        var dir = side === 'L' ? -1 : 1;
        s['horn' + side] = {
          d: path.limb(GEO.headCX + dir * hRX * 0.55, GEO.headCY - hRY * 0.78, 20,
                       -Math.PI / 2 + dir * 0.5, 6, dir * 4, { taper: 0.08, steps: 7 }),
          fill: XY.mixHex(skin.accent, '#FFFFFF', 0.2), stroke: skin.ink, opacity: 1
        };
      });
    }

    /* ---- EARS / BOLTS -------------------------------------------------- */
    if (g.earStyle !== 'none') {
      ['L', 'R'].forEach(function (side) {
        var dir = side === 'L' ? -1 : 1;
        var ex = GEO.headCX + dir * hRX * 0.98, ey = GEO.headCY - 4;
        s['ear' + side] = g.earStyle === 'bolt'
          ? { d: path.star(ex, ey, 9, 6.5, 6, 0), fill: skin.shadow, stroke: skin.ink, opacity: 1 }
          : { d: path.blob(ex, ey, 11, 13, { rand: rand, wobble: 0.05 }),
              fill: skin.main, stroke: skin.ink, opacity: 1 };
      });
    }

    /* ---- EYES — the single most important part ------------------------- */
    var eR = GEO.eyeR * g.eyeScale;
    ['L', 'R'].forEach(function (side) {
      var dir = side === 'L' ? -1 : 1;
      var ex = GEO.headCX + dir * GEO.eyeDX, ey = GEO.eyeCY;
      s['eyeWhite' + side] = {
        d: path.blob(ex, ey, eR, eR * (1 - g.squint), { points: 14, wobble: 0 }),
        fill: '#FFFFFF', stroke: skin.ink, opacity: 1
      };
      /* pupils look slightly inward and down — reads as friendly, not blank */
      s['pupil' + side] = {
        d: path.blob(ex - dir * 1.2, ey + 2.2, eR * 0.52, eR * 0.56, { points: 14, wobble: 0 }),
        fill: '#2A1B4A', opacity: 1
      };
      s['glint' + side] = {
        d: path.blob(ex - dir * 3.2 + 1, ey - 3.6, eR * 0.24, eR * 0.24, { points: 14, wobble: 0 }),
        fill: '#FFFFFF', opacity: 0.95
      };
    });

    /* pirate eyepatch */
    if (g.eyePatch) {
      s.patch = {
        d: path.blob(GEO.headCX - GEO.eyeDX, GEO.eyeCY - 1, eR * 1.35, eR * 1.2,
                     { points: 14, wobble: 0.02, rand: rand }),
        fill: '#2A1B4A', opacity: 1
      };
    }

    /* oversized sunglasses — Xyla's actual signature look */
    if (g.shades) {
      s.shades = { d: shadesPath(GEO.headCX, GEO.eyeCY, GEO.eyeDX, eR), fill: '#2A2340', opacity: 0.92 };
    }

    /* ---- CHEEKS — never optional. Rosy cheeks do enormous work. -------- */
    ['L', 'R'].forEach(function (side) {
      var dir = side === 'L' ? -1 : 1;
      s['cheek' + side] = {
        d: path.blob(GEO.headCX + dir * GEO.cheekDX, GEO.cheekCY, GEO.cheekR, GEO.cheekR * 0.72,
                     { points: 14, wobble: 0.04, rand: rand }),
        fill: '#FF8FB1', opacity: 0.5
      };
    });

    /* ---- MOUTH --------------------------------------------------------- */
    s.mouth = { d: mouthPath(g.mouthStyle, GEO.headCX, GEO.mouthCY), fill: '#2A1B4A', opacity: 1 };

    /* ---- HAT ------------------------------------------------------------
       A pirate hat has to read as PIRATE at thumbnail size, so it is built in
       four layers: a feather plume behind, the tricorn itself, a gold trim
       along the brim, and a badge. The badge is crossed bones with a lemon
       instead of a skull — unmistakably pirate, entirely un-scary for a
       three-year-old, and on-theme for the Lemon Sea.                      */
    var hatY = GEO.headCY - hRY * 0.92;
    if (g.hatStyle === 'tricorn') {
      var hw = hRX * 1.42;
      s.hatPlume = {
        d: plumePath(GEO.headCX + hw * 0.42, hatY - 6, g.plumeLen),
        fill: g.plumeColor, stroke: skin.ink, opacity: 1
      };
      s.hat = { d: tricornPath(GEO.headCX, hatY, hw), fill: '#2A1B4A', stroke: '#0B1730', opacity: 1 };
      s.hatTrim = { d: tricornTrim(GEO.headCX, hatY, hw), fill: '#FFD84D', opacity: 0.95 };
      s.hatEmblem = { d: crossbones(GEO.headCX, hatY - 4, 15), fill: '#FFF8EE', opacity: 1 };
      s.hatBadge = { d: lemonPath(GEO.headCX, hatY - 4, 8.5), fill: '#FFD84D', stroke: '#F0A500', opacity: 1 };
    } else if (g.hatStyle === 'bandana') {
      s.hat = { d: bandanaPath(GEO.headCX, GEO.headCY - hRY * 0.74, hRX * 1.12),
                fill: g.bandanaColor, stroke: skin.ink, opacity: 1 };
      s.hatTrim = { d: bandanaSpots(GEO.headCX, GEO.headCY - hRY * 0.78, hRX * 1.0),
                    fill: '#FFF8EE', opacity: 0.9 };
      s.hatEmblem = { d: crossbones(GEO.headCX, GEO.headCY - hRY * 0.82, 11), fill: '#FFF8EE', opacity: 1 };
      s.hatBadge = { d: lemonPath(GEO.headCX, GEO.headCY - hRY * 0.82, 6), fill: '#FFD84D', stroke: '#F0A500', opacity: 1 };
    }

    /* ---- ANTENNAE -------------------------------------------------------
       Robots get a stubby aerial with a lamp; butterflies get long curled
       feelers with a bobble on the end. Same two slots either way, so one
       can morph straight into the other.                                   */
    if (g.antenna) {
      var bug = g.has.butterfly && !g.has.robot;
      var aLen2 = bug ? 34 : 26;
      var aThick = bug ? 1.9 : 2.8;
      var sides = g.antennaCount === 2 ? ['L', 'R'] : ['L'];
      sides.forEach(function (side) {
        var dir = g.antennaCount === 2 ? (side === 'L' ? -1 : 1) : 0;
        var ax = GEO.headCX + dir * hRX * 0.42;
        var ay = GEO.headCY - hRY * 0.88;
        var ang = -Math.PI / 2 + dir * (bug ? 0.52 : 0.28);
        s['antenna' + side] = {
          d: path.limb(ax, ay, aLen2, ang, aThick, dir * (bug ? 9 : 3),
                       { taper: 0.55, steps: 8 }),
          fill: bug ? skin.ink : skin.shadow, stroke: skin.ink, opacity: 1
        };
        /* the bobble sits at the curled tip, not the straight-line tip */
        var tipX = ax + Math.cos(ang) * aLen2 - Math.sin(ang) * 0;
        var tipY = ay + Math.sin(ang) * aLen2;
        s['antennaBall' + side] = {
          d: path.blob(tipX, tipY, bug ? 5.5 : 6.5, bug ? 5.5 : 6.5, { points: 14, wobble: 0 }),
          fill: bug ? skin.accent : '#FFD84D', stroke: skin.ink, opacity: 1
        };
      });
    }

    /* ---- ACCESSORY ----------------------------------------------------- */
    if (g.accessory !== 'none') {
      s.accessory = accessoryPath(g.accessory, skin);
    }

    return s;
  }

  /* ---- sub-shapes ------------------------------------------------------ */
  function shadesPath(cx, cy, dx, r) {
    // Two big rounded lenses joined by a bridge — deliberately oversized.
    var lens = function (x) {
      return path.blob(x, cy, r * 1.5, r * 1.25, { points: 14, wobble: 0,
        shape: function (a) { return 1 + 0.1 * Math.cos(a * 2); } });
    };
    var bridge = path.roundRect(cx, cy - 2, dx * 0.9, 4.5, 1);
    var armL = path.roundRect(cx - dx - r * 1.5, cy - 4, 10, 4, 1);
    var armR = path.roundRect(cx + dx + r * 1.5, cy - 4, 10, 4, 1);
    return [lens(cx - dx), lens(cx + dx), bridge, armL, armR].join(' ');
  }

  function mouthPath(style, cx, cy) {
    if (style === 'oh') return path.blob(cx, cy + 2, 7, 8, { points: 14, wobble: 0 });
    if (style === 'grin') {
      var pts = path.scallop(cx - 13, cy, cx + 13, cy, 3, 4, false);
      return path.closedSpline(pts.concat([[cx + 13, cy - 5], [cx, cy - 6], [cx - 13, cy - 5]]), 0.6);
    }
    // default smile: a filled crescent
    var a = [], b = [], i, t;
    for (i = 0; i <= 8; i++) {
      t = i / 8;
      a.push([cx - 12 + 24 * t, cy + Math.sin(t * Math.PI) * 8.5]);
    }
    for (i = 8; i >= 0; i--) {
      t = i / 8;
      b.push([cx - 12 + 24 * t, cy + Math.sin(t * Math.PI) * 3.2]);
    }
    return path.closedSpline(a.concat(b), 0.8);
  }

  /* A proper tricorn: wide sweeping brim, three sharply upturned corners,
     and a tall crown. The exaggerated corner peaks are what make it read as
     a pirate hat and not a fedora. */
  function tricornPath(cx, cy, w) {
    var pts = [
      [cx - w, cy - 10],                          // left peak, turned up
      [cx - w * 0.72, cy + 2],
      [cx - w * 0.38, cy - 12],
      [cx, cy - 26],                              // centre peak, tallest
      [cx + w * 0.38, cy - 12],
      [cx + w * 0.72, cy + 2],
      [cx + w, cy - 10],                          // right peak
      [cx + w * 0.9, cy + 9],
      [cx + w * 0.45, cy + 15],
      [cx, cy + 17],
      [cx - w * 0.45, cy + 15],
      [cx - w * 0.9, cy + 9],
    ];
    var crown = path.blob(cx, cy - 7, w * 0.5, 16, { points: 14, wobble: 0 });
    return path.closedSpline(pts, 0.62) + ' ' + crown;
  }

  /* Gold trim hugging the brim edge. */
  function tricornTrim(cx, cy, w) {
    var outer = [
      [cx - w * 0.97, cy - 8], [cx - w * 0.7, cy + 3.5], [cx - w * 0.37, cy - 10],
      [cx, cy - 23], [cx + w * 0.37, cy - 10], [cx + w * 0.7, cy + 3.5],
      [cx + w * 0.97, cy - 8], [cx + w * 0.87, cy + 7], [cx + w * 0.44, cy + 13],
      [cx, cy + 15], [cx - w * 0.44, cy + 13], [cx - w * 0.87, cy + 7],
    ];
    var inner = outer.map(function (p) {
      return [cx + (p[0] - cx) * 0.86, cy + 4 + (p[1] - cy - 4) * 0.84];
    });
    /* two concentric rings, wound oppositely, gives a hollow band with the
       browser's default even-odd-ish nonzero fill doing the work */
    return path.closedSpline(outer, 0.62) + ' ' + path.closedSpline(inner.reverse(), 0.62);
  }

  /* Crossed bones — the pirate signal, minus anything frightening. */
  function crossbones(cx, cy, r) {
    var bone = function (ang) {
      var ca = Math.cos(ang), sa = Math.sin(ang);
      var shaft = path.limb(cx - ca * r, cy - sa * r, r * 2, ang, 2.6, 0, { taper: 1, steps: 6 });
      var knobs = '';
      [-1, 1].forEach(function (e) {
        var ex = cx + ca * r * e, ey = cy + sa * r * e;
        knobs += ' ' + path.blob(ex - sa * 3, ey + ca * 3, 3.4, 3.4, { points: 14, wobble: 0 });
        knobs += ' ' + path.blob(ex + sa * 3, ey - ca * 3, 3.4, 3.4, { points: 14, wobble: 0 });
      });
      return shaft + knobs;
    };
    return bone(0.72) + ' ' + bone(-0.72);
  }

  /* A lemon, sitting where a skull would go. On-theme and friendly. */
  function lemonPath(cx, cy, r) {
    return path.blob(cx, cy, r * 1.18, r * 0.86, {
      points: 14, wobble: 0,
      shape: function (a) { return 1 + 0.2 * Math.pow(Math.abs(Math.cos(a)), 6); }
    });
  }

  /* A feather plume tucked behind the brim. */
  function plumePath(x, y, len) {
    return path.limb(x, y, len, -1.15, 5.5, 16, { taper: 0.25, bulge: 0.5, steps: 10 });
  }

  function bandanaPath(cx, cy, w) {
    var body = path.closedSpline([
      [cx - w, cy + 3], [cx - w * 0.55, cy - 10], [cx, cy - 14], [cx + w * 0.55, cy - 10],
      [cx + w, cy + 3], [cx + w * 0.55, cy + 9], [cx, cy + 11], [cx - w * 0.55, cy + 9],
    ], 0.7);
    /* two trailing tails on the side, like a knotted headscarf */
    var knot = path.limb(cx + w * 0.88, cy + 4, 24, 0.55, 6, 7, { taper: 0.35, steps: 8 });
    var knot2 = path.limb(cx + w * 0.88, cy + 4, 18, 1.05, 4.5, 5, { taper: 0.3, steps: 8 });
    return body + ' ' + knot + ' ' + knot2;
  }

  function bandanaSpots(cx, cy, w) {
    var out = [];
    for (var i = 0; i < 5; i++) {
      var t = i / 4;
      out.push(path.blob(cx - w * 0.75 + w * 1.5 * t, cy + Math.sin(t * Math.PI) * -3 + 6,
                         2.6, 2.6, { points: 14, wobble: 0 }));
    }
    return out.join(' ');
  }

  function accessoryPath(kind, skin) {
    if (kind === 'cutlass') {
      var blade = path.limb(150, 150, 46, -1.15, 5, 9, { taper: 0.1, steps: 9 });
      var hilt = path.roundRect(150, 152, 16, 5, 1);
      return { d: blade + ' ' + hilt, fill: '#DCE6F2', stroke: '#2A1B4A', opacity: 1 };
    }
    if (kind === 'lolly') {
      var stick = path.roundRect(150, 146, 4, 34, 1);
      var candy = path.blob(150, 124, 14, 14, { points: 14, wobble: 0 });
      return { d: candy + ' ' + stick, fill: '#FF8FB1', stroke: '#2A1B4A', opacity: 1 };
    }
    if (kind === 'balloon') {
      var str = path.limb(152, 150, 40, -1.5, 1.4, 6, { taper: 1, steps: 7 });
      var ball = path.blob(156, 100, 17, 20, { points: 14, wobble: 0.03 });
      return { d: ball + ' ' + str, fill: skin.accent, stroke: '#2A1B4A', opacity: 1 };
    }
    // flag
    var pole = path.roundRect(150, 132, 3.5, 56, 1);
    var cloth = path.closedSpline([
      [152, 106], [172, 110], [186, 104], [186, 122], [170, 128], [152, 124],
    ], 0.8);
    return { d: pole + ' ' + cloth, fill: '#FFD84D', stroke: '#2A1B4A', opacity: 1 };
  }

  /* ======================================================================
   *  RENDER — spec to DOM
   * ==================================================================== */
  function render(g, opts) {
    opts = opts || {};
    var sp = spec(g);
    /* The drawing lives in a 0..200 box, but wings, tails and flags reach
       outside it — so the viewBox is padded to give them room to breathe. */
    var svg = XY.svgEl('svg', {
      viewBox: '-28 -18 256 232', class: 'creature',
      'aria-hidden': 'true', focusable: 'false', overflow: 'visible'
    });
    var root = XY.svgEl('g', { class: 'c-root' });
    /* two nested groups so flight (outer, composited) and squash (inner)
       never fight over the same transform attribute */
    var flap = XY.svgEl('g', { class: 'c-body' });
    var nodes = {};

    SLOTS.forEach(function (slot) {
      var a = sp[slot];
      var p = XY.svgEl('path', {
        d: a.d,
        fill: a.fill || 'none',
        opacity: a.opacity,
        'data-slot': slot,
      });
      if (a.stroke) {
        p.setAttribute('stroke', a.stroke);
        p.setAttribute('stroke-width', 3);
        p.setAttribute('stroke-linejoin', 'round');
        p.setAttribute('paint-order', 'stroke');
      }
      nodes[slot] = p;
      // wings live in their own groups so they can flap around a hinge
      flap.appendChild(p);
    });

    root.appendChild(flap);
    svg.appendChild(root);

    var c = {
      genome: g, spec: sp, svg: svg, root: root, body: flap, nodes: nodes,
      name: g.name,
    };
    return c;
  }

  /* ======================================================================
   *  MORPH — the centrepiece.
   *  Every slot has a counterpart by construction, so this is a total
   *  transformation with no special cases: shape, colour and opacity all
   *  travel at once, hidden under a squash-and-stretch beat that reads as
   *  cartoon anticipation rather than as a swap.
   * ==================================================================== */
  function morphTo(c, newGenome, opts) {
    opts = opts || {};
    var dur = opts.duration || 0.9;
    var target = spec(newGenome);
    var tl = gsap.timeline();

    /* anticipation: squash down, then spring out */
    tl.to(c.body, { scaleY: 0.7, scaleX: 1.24, duration: 0.18, ease: 'power2.in',
                    transformOrigin: '100px 184px' }, 0);

    SLOTS.forEach(function (slot) {
      var node = c.nodes[slot];
      var to = target[slot];
      var from = c.spec[slot];
      /* MorphSVGPlugin handles differing point counts and winding for us,
         which is why the parts can be genuinely different shapes. */
      if (to.d !== from.d) {
        tl.to(node, {
          morphSVG: { shape: to.d, shapeIndex: 'auto' },
          duration: dur, ease: 'power2.inOut'
        }, 0.1);
      }
      tl.to(node, {
        attr: { fill: to.fill || 'none', stroke: to.stroke || null },
        opacity: to.opacity,
        duration: dur * 0.7, ease: 'power1.inOut'
      }, 0.14);
    });

    tl.to(c.body, { scaleY: 1, scaleX: 1, duration: 0.7, ease: 'elastic.out(1, 0.45)' }, 0.18);

    c.genome = newGenome;
    c.spec = target;
    c.name = newGenome.name;
    return tl;
  }

  /* ======================================================================
   *  AMBIENT LIFE — never added to the master timeline.
   *  These loop forever so the world stays alive after the story ends, and so
   *  the master timeline remains cleanly seekable.
   * ==================================================================== */
  function animate(c, rand) {
    rand = rand || XY.rng(c.genome.seed + 3);
    var g = c.genome;
    var tls = [];

    /* breathing */
    tls.push(gsap.to(c.body, {
      scaleY: 1.045, scaleX: 0.975, duration: rand.range(1.3, 2.1),
      repeat: -1, yoyo: true, ease: 'sine.inOut', transformOrigin: '100px 184px'
    }));

    /* blinking — random, sparse, never in sync across the cast */
    var blink = function () {
      gsap.timeline({ onComplete: function () { gsap.delayedCall(rand.range(1.8, 6), blink); } })
        .to([c.nodes.eyeWhiteL, c.nodes.eyeWhiteR, c.nodes.pupilL, c.nodes.pupilR,
             c.nodes.glintL, c.nodes.glintR], {
          scaleY: 0.08, duration: 0.09, ease: 'power2.in', transformOrigin: '50% 50%'
        })
        .to([c.nodes.eyeWhiteL, c.nodes.eyeWhiteR, c.nodes.pupilL, c.nodes.pupilR,
             c.nodes.glintL, c.nodes.glintR], {
          scaleY: 1, duration: 0.12, ease: 'power2.out'
        });
    };
    gsap.delayedCall(rand.range(0.5, 4), blink);

    /* wing flap / fin shimmer */
    var wings = [c.nodes.wingBackL, c.nodes.wingBackR, c.nodes.wingFrontL, c.nodes.wingFrontR];
    if (g.has.butterfly) {
      tls.push(gsap.to([c.nodes.wingBackL, c.nodes.wingFrontL], {
        scaleX: 0.62, rotation: 7, duration: rand.range(0.28, 0.45), repeat: -1, yoyo: true,
        ease: 'sine.inOut', transformOrigin: '100px 128px'
      }));
      tls.push(gsap.to([c.nodes.wingBackR, c.nodes.wingFrontR], {
        scaleX: 0.62, rotation: -7, duration: rand.range(0.28, 0.45), repeat: -1, yoyo: true,
        ease: 'sine.inOut', transformOrigin: '100px 128px'
      }));
    } else {
      tls.push(gsap.to(wings, {
        rotation: 4, duration: rand.range(1.4, 2.4), repeat: -1, yoyo: true,
        ease: 'sine.inOut', transformOrigin: '100px 130px'
      }));
    }

    /* tail wag */
    if (c.nodes.tail) {
      tls.push(gsap.to(c.nodes.tail, {
        rotation: rand.range(5, 11), duration: rand.range(0.9, 1.6), repeat: -1, yoyo: true,
        ease: 'sine.inOut', transformOrigin: '100px 140px'
      }));
    }

    /* antenna bob + LED pulse (slow — nothing on this page flickers faster
       than 3Hz, for photosensitivity safety) */
    ['L', 'R'].forEach(function (side) {
      var ball = c.nodes['antennaBall' + side];
      if (ball && +ball.getAttribute('opacity') > 0) {
        tls.push(gsap.to(ball, { scale: 1.25, opacity: 0.75, duration: rand.range(0.9, 1.4),
          repeat: -1, yoyo: true, ease: 'sine.inOut', transformOrigin: '50% 50%' }));
      }
    });

    c.ambient = tls;
    return tls;
  }

  /* A quick happy reaction — used when a kid taps a creature. */
  function react(c) {
    var tl = gsap.timeline();
    tl.to(c.body, { scaleY: 0.78, scaleX: 1.2, duration: 0.12, ease: 'power2.in',
                    transformOrigin: '100px 184px' })
      .to(c.body, { scaleY: 1.14, scaleX: 0.9, duration: 0.18, ease: 'power2.out' })
      .to(c.body, { scaleY: 1, scaleX: 1, duration: 0.6, ease: 'elastic.out(1, 0.4)' });
    tl.to(c.root, { rotation: XY.rng(Date.now() & 1023).sign() * 8, duration: 0.16,
                    yoyo: true, repeat: 1, ease: 'sine.inOut',

<script>
/* ============================================================================
 *  hero.js — Captain Xyla
 *  ---------------------------------------------------------------------------
 *  The birthday girl, as a cartoon.
 *
 *  Drawn from three cues in a photograph her dad shared: a huge mane of
 *  windswept curls, enormous round sunglasses, and a lemon-print dress. She is
 *  deliberately stylised in exactly the same visual language as the rest of the
 *  cast — big head, huge eyes, round everything — and is NOT a likeness. The
 *  photograph is a style reference only; it is never displayed, never stored in
 *  this repository, and never uploaded anywhere.
 * ==========================================================================*/
(function (XY) {
  'use strict';

  var path = XY.path;

  var SKIN = '#F4C6A0', SKIN_SHADE = '#E0A87C';
  var HAIR = '#A9714B', HAIR_LIGHT = '#C79462', HAIR_DARK = '#8A5836';
  var DRESS = '#FFFDF6', DRESS_SHADE = '#EDE7FB';
  var INK = '#2A1B4A';

  var SLOTS = [
    'glow', 'hairBack', 'legL', 'legR', 'dress', 'dressHem',
    'lemons', 'leaves', 'armL', 'armR',
    'head', 'hairFront', 'curls',
    'earL', 'earR', 'cheekL', 'cheekR', 'mouth',
    'shadeStrap', 'shadeL', 'shadeR', 'shadeGlint',
    'hat', 'hatTrim', 'hatBadge',
  ];

  /* The lemon-print pattern: scattered lemons and little teal leaves, laid out
     from a seeded PRNG so the dress looks hand-printed rather than tiled. */
  function printPattern(rand, cx, topY, botY, halfTop, halfBot) {
    var lemons = [], leaves = [], i, t, w, x, y;
    var N = 11;
    for (i = 0; i < N; i++) {
      /* Stratified, not uniform: each lemon gets its own horizontal band and
         its own side of the centre line. Pure random clumps into a bouquet. */
      t = (i + rand.range(0.15, 0.85)) / N;
      y = topY + (botY - topY) * t;
      w = XY.lerp(halfTop, halfBot, t) * 0.74;
      x = cx + (i % 2 ? 1 : -1) * rand.range(w * 0.18, w);
      var r = rand.range(3.4, 4.8);
      lemons.push(path.blob(x, y, r * 1.2, r * 0.82, {
        points: 14, wobble: 0, rotate: rand.range(-0.6, 0.6),
        shape: function (a) { return 1 + 0.22 * Math.pow(Math.abs(Math.cos(a)), 6); }
      }));
      if (rand.chance(0.6)) {
        leaves.push(path.limb(x + r * 1.2, y - r * 0.4, rand.range(5, 7),
                              rand.range(-1.1, -0.3), 1.9, 1.8, { taper: 0.25, steps: 7 }));
      }
    }
    return { lemons: lemons.join(' '), leaves: leaves.join(' ') };
  }

  function spec(opts) {
    opts = opts || {};
    var rand = XY.rng(opts.seed || 'captain-xyla');
    var withHat = opts.hat !== false;
    var s = {};
    SLOTS.forEach(function (k) {
      s[k] = { d: path.blob(100, 120, 0.8, 0.8, { points: 14, wobble: 0 }), fill: 'none', opacity: 0 };
    });

    var headCX = 100, headCY = 72, hRX = 42, hRY = 40;
    var shoulderY = 126, hemY = 177, halfTop = 23, halfBot = 47;

    s.glow = { d: path.blob(100, 100, 86, 84, { points: 14, wobble: 0.03, rand: rand }),
               fill: '#FFD84D', opacity: 0.15 };

    /* ---- HAIR, back mass — big, round and windswept ------------------- */
    s.hairBack = {
      d: path.blob(headCX + 2, headCY + 2, hRX * 1.38, hRY * 1.3, {
        points: 14, wobble: 0.07, rand: rand,
        shape: function (a) { return 1 + 0.1 * Math.sin(a * 3); }
      }),
      fill: HAIR, stroke: INK, opacity: 1
    };

    /* ---- LEGS ---------------------------------------------------------- */
    ['L', 'R'].forEach(function (side) {
      var dir = side === 'L' ? -1 : 1;
      var lx = headCX + dir * 15, ang = Math.PI / 2 - dir * 0.1;
      var len = 24;
      var fx = lx + Math.cos(ang) * len, fy = hemY - 4 + Math.sin(ang) * len;
      s['leg' + side] = {
        d: path.limb(lx, hemY - 4, len, ang, 7.5, dir * 2, { taper: 1, steps: 7 }) +
           ' ' + path.blob(fx + dir * 3, fy + 1, 11, 7.5, { points: 14, wobble: 0.04, rand: rand }),
        fill: SKIN, stroke: INK, opacity: 1
      };
    });

    /* ---- DRESS — an A-line, the shape of the swimsuit skirt ------------ */
    s.dress = {
      d: path.closedSpline([
        [headCX - halfTop, shoulderY], [headCX, shoulderY - 5], [headCX + halfTop, shoulderY],
        [headCX + halfTop * 1.25, shoulderY + 20],
        [headCX + halfBot, hemY - 6], [headCX + halfBot * 0.6, hemY + 3],
        [headCX, hemY + 6], [headCX - halfBot * 0.6, hemY + 3],
        [headCX - halfBot, hemY - 6],
        [headCX - halfTop * 1.25, shoulderY + 20],
      ], 0.8),
      fill: DRESS, stroke: INK, opacity: 1
    };
    /* the ruffle at the hem */
    s.dressHem = {
      d: path.closedSpline(
        path.scallop(headCX - halfBot, hemY - 4, headCX + halfBot, hemY - 4, 5, 5, false)
          .concat([[headCX + halfBot * 0.6, hemY + 4], [headCX, hemY + 7],
                   [headCX - halfBot * 0.6, hemY + 4]]), 0.7),
      fill: DRESS_SHADE, stroke: INK, opacity: 1

    var print = printPattern(rand, headCX, shoulderY + 6, hemY - 2, halfTop, halfBot);
    s.lemons = { d: print.lemons, fill: '#FFD84D', stroke: '#F0A500', opacity: 1 };
    s.leaves = { d: print.leaves, fill: '#0E7C7B', opacity: 0.9 };

    /* ---- ARMS ---------------------------------------------------------- */
    ['L', 'R'].forEach(function (side) {
      var dir = side === 'L' ? -1 : 1;
      var sx = headCX + dir * halfTop * 0.9, ay = shoulderY + 6;
      var ang = dir > 0 ? 0.75 : Math.PI - 0.75, len = 30;
      var hx = sx + Math.cos(ang) * len, hy = ay + Math.sin(ang) * len;
      s['arm' + side] = {
        d: path.limb(sx, ay, len, ang, 6.5, dir * -6, { taper: 0.85, steps: 7 }) +
           ' ' + path.blob(hx, hy, 8.5, 8.5, { points: 14, wobble: 0.05, rand: rand }),
        fill: SKIN, stroke: INK, opacity: 1
      };
    });

    /* ---- HEAD ---------------------------------------------------------- */
    s.head = {
      d: path.blob(headCX, headCY, hRX, hRY, {
        points: 14, wobble: 0.02, rand: rand,
        shape: function (a) { return 1 + 0.07 * Math.sin(a); }
      }),
      fill: SKIN, stroke: INK, opacity: 1
    };

    ['L', 'R'].forEach(function (side) {
      var dir = side === 'L' ? -1 : 1;
      s['ear' + side] = {
        d: path.blob(headCX + dir * hRX * 0.97, headCY + 4, 7, 9, { points: 14, wobble: 0 }),
        fill: SKIN, stroke: INK, opacity: 1
      };
    });

    /* ---- HAIR, front — a soft fringe over the brow -------------------- */
    s.hairFront = {
      d: path.closedSpline([
        [headCX - hRX * 1.02, headCY - 4],
        [headCX - hRX * 0.8, headCY - hRY * 0.86],
        [headCX - hRX * 0.2, headCY - hRY * 1.12],
        [headCX + hRX * 0.45, headCY - hRY * 1.05],
        [headCX + hRX * 0.95, headCY - hRY * 0.6],
        [headCX + hRX * 1.04, headCY + 2],
        [headCX + hRX * 0.62, headCY - hRY * 0.3],
        [headCX + hRX * 0.1, headCY - hRY * 0.44],
        [headCX - hRX * 0.42, headCY - hRY * 0.26],
        [headCX - hRX * 0.72, headCY - hRY * 0.36],
      ], 0.85),
      fill: HAIR_LIGHT, stroke: INK, opacity: 1
    };

    /* ---- CURLS — the signature. A ring of overlapping blobs of varying
            size, which is what makes hair read as curly rather than as a
            helmet. Seeded, so her hair is the same every single load. ---- */
    var curls = [];
    for (var i = 0; i < 24; i++) {
      var a = (i / 24) * XY.TAU + rand.range(-0.08, 0.08);
      /* bias the mass outward and downward — windswept, not symmetrical */
      var rr = hRX * (1.34 + 0.16 * Math.sin(a * 2) + 0.1 * Math.sin(a + 1.3));
      var cx2 = headCX + 3 + Math.cos(a) * rr;
      var cy2 = headCY + 4 + Math.sin(a) * rr * 0.92;
      var cr = rand.range(9, 14);
      /* Curls pile up on top and down the sides and STOP around the jaw.
         Carried all the way round the chin they read as a lion's mane. */
      if (Math.sin(a) > 0.52) continue;
      /* Keep the whole face clear. Hair that creeps over the cheeks and mouth
         reads as a bush, not as a haircut — so any curl whose disc would
         intrude on the front of the face is simply dropped. */
      var faceDX = (cx2 - headCX) / (hRX + cr * 0.55);
      var faceDY = (cy2 - (headCY + 6)) / (hRY + cr * 0.5);
      if (faceDX * faceDX + faceDY * faceDY < 1 && cy2 > headCY - hRY * 0.55) continue;
      curls.push(path.blob(cx2, cy2, cr, cr * rand.range(0.85, 1.1),
                           { points: 14, wobble: 0.16, rand: rand }));
    }
    s.curls = { d: curls.join(' '), fill: HAIR, stroke: INK, opacity: 1 };

    /* ---- FACE ---------------------------------------------------------- */
    ['L', 'R'].forEach(function (side) {
      var dir = side === 'L' ? -1 : 1;
      s['cheek' + side] = {
        d: path.blob(headCX + dir * 27, headCY + 17, 8, 5.5, { points: 14, wobble: 0.04, rand: rand }),
        fill: '#FF8FB1', opacity: 0.55
      };
    });

    /* a big open happy smile */
    var a1 = [], b1 = [], j, t2;
    for (j = 0; j <= 8; j++) { t2 = j / 8; a1.push([headCX - 13 + 26 * t2, headCY + 20 + Math.sin(t2 * Math.PI) * 9]); }
    for (j = 8; j >= 0; j--) { t2 = j / 8; b1.push([headCX - 13 + 26 * t2, headCY + 20 + Math.sin(t2 * Math.PI) * 2.5]); }
    s.mouth = { d: path.closedSpline(a1.concat(b1), 0.8), fill: INK, opacity: 1 };

    /* ---- THE SUNGLASSES — oversized, round, and the whole personality -- */
    var gy = headCY - 2, gdx = 17, gr = 15;
    s.shadeStrap = {
      d: path.roundRect(headCX, gy - 1, gdx * 1.05, 4.5, 1) + ' ' +
         path.roundRect(headCX - gdx - gr * 1.15, gy - 3, 12, 4, 1) + ' ' +
         path.roundRect(headCX + gdx + gr * 1.15, gy - 3, 12, 4, 1),
      fill: '#3A3358', opacity: 1
    };
    var lens = function (x) {
      return path.blob(x, gy, gr * 1.22, gr * 1.1, {
        points: 14, wobble: 0,
        shape: function (a) { return 1 + 0.08 * Math.cos(a * 2); }
      });
    };
    s.shadeL = { d: lens(headCX - gdx), fill: '#2A2340', stroke: INK, opacity: 0.95 };
    s.shadeR = { d: lens(headCX + gdx), fill: '#2A2340', stroke: INK, opacity: 0.95 };
    /* two little highlights so the lenses look like glass, not holes */
    s.shadeGlint = {
      d: path.blob(headCX - gdx - 6, gy - 6, 5.5, 3.4, { points: 14, wobble: 0, rotate: -0.5 }) + ' ' +
         path.blob(headCX + gdx - 6, gy - 6, 5.5, 3.4, { points: 14, wobble: 0, rotate: -0.5 }),
      fill: '#FFFFFF', opacity: 0.5
    };

    /* ---- CAPTAIN'S HAT ------------------------------------------------- */
    if (withHat) {
      var hy = headCY - hRY * 1.42, hw = hRX * 1.5;
      s.hat = {
        d: path.closedSpline([
          [headCX - hw, hy - 8], [headCX - hw * 0.72, hy + 3], [headCX - hw * 0.38, hy - 11],
          [headCX, hy - 24], [headCX + hw * 0.38, hy - 11], [headCX + hw * 0.72, hy + 3],
          [headCX + hw, hy - 8], [headCX + hw * 0.9, hy + 10], [headCX + hw * 0.45, hy + 16],
          [headCX, hy + 18], [headCX - hw * 0.45, hy + 16], [headCX - hw * 0.9, hy + 10],
        ], 0.62),
        fill: '#2A1B4A', stroke: '#0B1730', opacity: 1
      };
      s.hatTrim = {
        d: path.closedSpline([
          [headCX - hw * 0.96, hy - 6], [headCX - hw * 0.7, hy + 4], [headCX - hw * 0.37, hy - 9],
          [headCX, hy - 21], [headCX + hw * 0.37, hy - 9], [headCX + hw * 0.7, hy + 4],
          [headCX + hw * 0.96, hy - 6], [headCX + hw * 0.86, hy + 8], [headCX + hw * 0.44, hy + 14],
          [headCX, hy + 16], [headCX - hw * 0.44, hy + 14], [headCX - hw * 0.86, hy + 8],
        ], 0.62) + ' ' + path.closedSpline([
          [headCX - hw * 0.82, hy - 3], [headCX - hw * 0.6, hy + 4], [headCX - hw * 0.32, hy - 6],
          [headCX, hy - 16], [headCX + hw * 0.32, hy - 6], [headCX + hw * 0.6, hy + 4],
          [headCX + hw * 0.82, hy - 3], [headCX + hw * 0.74, hy + 6], [headCX + hw * 0.38, hy + 11],
          [headCX, hy + 13], [headCX - hw * 0.38, hy + 11], [headCX - hw * 0.74, hy + 6],
        ].reverse(), 0.62),
        fill: '#FFD84D', opacity: 0.95
      };
      s.hatBadge = {
        d: path.blob(headCX, hy - 3, 9, 6.6, {
          points: 14, wobble: 0,
          shape: function (a) { return 1 + 0.22 * Math.pow(Math.abs(Math.cos(a)), 6); }
        }),
        fill: '#FFD84D', stroke: '#F0A500', opacity: 1
      };
    }

    return s;
  }

  function render(opts) {
    var sp = spec(opts);
    var svg = XY.svgEl('svg', {
      viewBox: '-30 -40 260 250', class: 'creature hero',
      'aria-hidden': 'true', focusable: 'false', overflow: 'visible'
    });
    var root = XY.svgEl('g', { class: 'c-root' });
    var body = XY.svgEl('g', { class: 'c-body' });
    var nodes = {};
    SLOTS.forEach(function (slot) {
      var a = sp[slot];
      var p = XY.svgEl('path', { d: a.d, fill: a.fill || 'none', opacity: a.opacity, 'data-slot': slot });
      if (a.stroke) {
        p.setAttribute('stroke', a.stroke);
        p.setAttribute('stroke-width', 3);
        p.setAttribute('stroke-linejoin', 'round');
        p.setAttribute('paint-order', 'stroke');

      nodes[slot] = p;
      body.appendChild(p);

    svg.appendChild(root);
    return { svg: svg, root: root, body: body, nodes: nodes, spec: sp, name: 'Captain Xyla' };
  }

  /* Ambient life — she breathes, her curls bounce, her hat tips. */
  function animate(h) {
    var rand = XY.rng('xyla-anim');
    gsap.to(h.body, {
      scaleY: 1.04, scaleX: 0.98, duration: 1.7, repeat: -1, yoyo: true,
      ease: 'sine.inOut', transformOrigin: '100px 180px'
    });
    gsap.to(h.nodes.curls, {
      rotation: 1.6, scaleX: 1.02, duration: 2.3, repeat: -1, yoyo: true,
      ease: 'sine.inOut', transformOrigin: '100px 90px'
    });
    gsap.to([h.nodes.hat, h.nodes.hatTrim, h.nodes.hatBadge], {
      rotation: -2.5, duration: 2.9, repeat: -1, yoyo: true,
      ease: 'sine.inOut', transformOrigin: '100px 40px'
    });
    gsap.to(h.nodes.shadeGlint, {
      opacity: 0.85, duration: 2.1, repeat: -1, yoyo: true, ease: 'sine.inOut'
    });
  }

  XY.Hero = { spec: spec, render: render, animate: animate, SLOTS: SLOTS };

})(window.XY = window.XY || {});

<script>
/* ============================================================================
 *  ufo.js — the flying saucer fleet
 *  ---------------------------------------------------------------------------
 *  Generated saucers with glassy domes, lit portholes, seeded liveries and
 *  tractor beams that can pick a creature up, change it, and set it back down.
 *
 *  The abduct-and-return cycle is the best toy on the page: a kid taps a UFO,
 *  it beams a creature up, and a different creature comes back down. It is also
 *  the clearest possible demonstration of the morph engine.
 *
 *  Glow is stacked translucent shapes, never an SVG blur filter — blur filters
 *  are the single worst source of jank on phones.
 * ==========================================================================*/
(function (XY) {
  'use strict';

  var path = XY.path;
  var uid = 0;

  var HULLS = [
    ['#C9A7F5', '#8E6BD1'], ['#9BE8C8', '#4FC79B'], ['#FFD84D', '#F0A500'],
    ['#FF8FB1', '#E8618A'], ['#A8D8FF', '#6FAEE8'], ['#FFB4A1', '#FF8B6B'],
  ];

  function genome(seed) {
    var rand = XY.rng(seed);
    var hull = rand.pick(HULLS);
    return {
      seed: seed, rand: rand,
      hull: hull[0], hullShade: hull[1],
      dome: rand.pick(['#BDE7F5', '#FFE9A8', '#F7C6E0', '#D9F5E8']),
      portholes: rand.int(5, 8),
      portColor: rand.pick(['#FFD84D', '#FF8FB1', '#9BE8C8', '#FFFFFF']),
      width: rand.range(0.85, 1.2),
      livery: rand.pick(['dots', 'stripe', 'scallop', 'plain']),
      beaconColor: rand.pick(['#FF8FB1', '#FFD84D', '#9BE8C8']),
    };
  }

  /* The drawing box is 0..200 wide, saucer centred at (100, 70). */
  function build(g) {
    var rand = XY.rng(g.seed + 11);
    var w = 78 * g.width;
    var parts = [];

    /* soft glow beneath — three stacked translucent ellipses */
    parts.push({ slot: 'glow', d: path.blob(100, 78, w * 1.25, 26, { points: 14, wobble: 0.03, rand: rand }),
                 fill: g.hull, opacity: 0.14 });

    /* under-hull */
    parts.push({ slot: 'hull', d: path.blob(100, 80, w * 0.82, 20, {
                   points: 14, wobble: 0.02, rand: rand,
                   shape: function (a) { return 1 + 0.18 * Math.sin(a); } }),
                 fill: g.hullShade, stroke: '#2A1B4A', opacity: 1 });

    /* main rim — the wide saucer disc */
    parts.push({ slot: 'rim', d: path.blob(100, 70, w, 17, { points: 14, wobble: 0.015, rand: rand }),
                 fill: g.hull, stroke: '#2A1B4A', opacity: 1 });

    /* glassy dome */
    parts.push({ slot: 'dome', d: path.blob(100, 52, w * 0.44, 26, {
                   points: 14, wobble: 0.02, rand: rand,
                   shape: function (a) { return 1 - 0.28 * Math.max(0, Math.sin(a)); } }),
                 fill: g.dome, stroke: '#2A1B4A', opacity: 1 });

    /* a highlight streak on the dome so it reads as glass, not plastic */
    parts.push({ slot: 'domeGlint', d: path.blob(100 - w * 0.16, 44, w * 0.11, 8,
                   { points: 14, wobble: 0, rotate: -0.5 }),
                 fill: '#FFFFFF', opacity: 0.55 });

    /* livery */
    if (g.livery === 'stripe') {
      parts.push({ slot: 'livery', d: path.roundRect(100, 70, w * 1.7, 5, 1),
                   fill: '#FFF8EE', opacity: 0.75 });
    } else if (g.livery === 'scallop') {
      parts.push({ slot: 'livery',
                   d: path.closedSpline(path.scallop(100 - w, 74, 100 + w, 74, 6, 4, false)
                        .concat([[100 + w, 68], [100, 66], [100 - w, 68]]), 0.7),
                   fill: '#FFF8EE', opacity: 0.6 });
    } else if (g.livery === 'dots') {
      var dots = [];
      for (var i = 0; i < 7; i++) {
        dots.push(path.blob(100 - w * 0.8 + (w * 1.6) * (i / 6), 62, 3.4, 3.4, { points: 14, wobble: 0 }));
      }
      parts.push({ slot: 'livery', d: dots.join(' '), fill: '#FFF8EE', opacity: 0.7 });
    }

    /* portholes, each its own node so they can light in sequence */
    var ports = [];
    for (var p = 0; p < g.portholes; p++) {
      var t = (p + 0.5) / g.portholes;
      var px = 100 + (t - 0.5) * 2 * w * 0.86;
      var py = 76 + Math.sin(t * Math.PI) * 3;
      ports.push({ slot: 'port' + p, d: path.blob(px, py, 5.2, 5.2, { points: 14, wobble: 0 }),
                   fill: g.portColor, stroke: '#2A1B4A', opacity: 1, port: true });
    }
    parts = parts.concat(ports);

    /* beacon on top */
    parts.push({ slot: 'beaconStalk', d: path.roundRect(100, 26, 3, 10, 1),
                 fill: '#2A1B4A', opacity: 1 });
    parts.push({ slot: 'beacon', d: path.blob(100, 21, 7, 7, { points: 14, wobble: 0 }),
                 fill: g.beaconColor, stroke: '#2A1B4A', opacity: 1 });

    return { parts: parts, w: w, portCount: g.portholes };
  }

  function render(g) {
    var built = build(g);
    var id = 'ufo' + (uid++);
    var svg = XY.svgEl('svg', {
      viewBox: '-20 0 240 320', class: 'ufo',
      'aria-hidden': 'true', focusable: 'false', overflow: 'visible'
    });

    /* gradient for the tractor beam — a def, not a filter */
    var defs = XY.svgEl('defs');
    var grad = XY.svgEl('linearGradient', { id: id + '-beam', x1: '0', y1: '0', x2: '0', y2: '1' });
    [['0%', 0.62], ['55%', 0.3], ['100%', 0]].forEach(function (s) {
      grad.appendChild(XY.svgEl('stop', { offset: s[0], 'stop-color': g.portColor, 'stop-opacity': s[1] }));
    });
    defs.appendChild(grad);
    var clip = XY.svgEl('clipPath', { id: id + '-clip' });
    var beamShape = path.closedSpline([
      [100 - built.w * 0.28, 84], [100 + built.w * 0.28, 84],
      [100 + built.w * 0.95, 300], [100 - built.w * 0.95, 300],
    ], 0.25);
    clip.appendChild(XY.svgEl('path', { d: beamShape }));
    defs.appendChild(clip);
    svg.appendChild(defs);

    var root = XY.svgEl('g', { class: 'u-root' });

    /* ---- the beam, behind the saucer ---- */
    var beamG = XY.svgEl('g', { class: 'u-beam', opacity: 0 });
    beamG.appendChild(XY.svgEl('path', { d: beamShape, fill: 'url(#' + id + '-beam)' }));
    var chevG = XY.svgEl('g', { 'clip-path': 'url(#' + id + '-clip)' });
    var chevrons = [];
    for (var c = 0; c < 4; c++) {
      var cy = 100 + c * 52;
      var ch = XY.svgEl('path', {
        d: path.closedSpline([
          [100 - built.w * 0.5, cy], [100, cy + 12], [100 + built.w * 0.5, cy],
          [100, cy + 3],

<script>
/* ============================================================================
 *  sky.js — the candy-sky visualizer
 *  ---------------------------------------------------------------------------
 *  One fullscreen WebGL triangle running a soft, high-value fragment shader:
 *  a vertical pastel gradient, domain-warped cotton-cloud bands, a portal bloom
 *  that opens as the story advances, a twinkling star field, and a wide gentle
 *  rainbow arc.
 *

 *    - Nothing in here oscillates in brightness faster than ~1Hz. No strobing,
 *      ever. (Photosensitivity.)

 *      the page carries on. The invitation must never depend on a GPU.

  'use strict';

  var VERT = [
    'attribute vec2 aPos;',
    'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'
  ].join('\n');

    'precision mediump float;',
    'uniform vec2  uRes;',
    'uniform float uTime;',
    'uniform float uProgress;',   // 0..1 story progress
    'uniform float uPortal;',     // 0..1 how open the portal is
    'uniform vec3  uPalA;',       // top
    'uniform vec3  uPalB;',       // middle
    'uniform vec3  uPalC;',       // bottom
    'uniform vec2  uPointer;',
    'uniform vec3  uAudio;',      // bass, mid, high — all gentle
    'uniform float uOctaves;',

    'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }',

    'float noise(vec2 p){',
    '  vec2 i = floor(p), f = fract(p);',
    '  vec2 u = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(hash(i), hash(i + vec2(1.0,0.0)), u.x),',
    '             mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);',
    '}',

    'float fbm(vec2 p){',
    '  float v = 0.0, a = 0.5;',
    '  for (int i = 0; i < 5; i++){',
    '    if (float(i) >= uOctaves) break;',
    '    v += a * noise(p);',
    '    p *= 2.02; a *= 0.5;',
    '  }',
    '  return v;',
    '}',

    '  vec2 uv = gl_FragCoord.xy / uRes.xy;',
    '  vec2 p  = (gl_FragCoord.xy - 0.5 * uRes.xy) / min(uRes.x, uRes.y);',
    '  float t = uTime * 0.045;',

    '  col = mix(col, uPalA, smoothstep(0.45, 1.0, uv.y));',

    /* domain-warped cloud bands — soft, wide, slow */
    '  vec2 q = vec2(fbm(p * 1.6 + vec2(t, 0.0)), fbm(p * 1.6 + vec2(5.2, -t)));',
    '  float warp = 0.55 + 0.25 * uAudio.x;',
    '  float clouds = fbm(p * 2.1 + q * warp + vec2(0.0, t * 0.6));',
    '  col = mix(col, mix(col, vec3(1.0), 0.55), smoothstep(0.42, 0.95, clouds) * 0.5);',

    /* a soft candy band that drifts with the pointer, so the sky feels alive
       under a finger without anything jumping */
    '  float band = smoothstep(0.35, 0.0, abs(p.y - 0.06 * sin(p.x * 2.0 + t * 3.0) - uPointer.y * 0.06));',
    '  col += band * 0.05 * vec3(1.0, 0.85, 0.95);',

    /* portal bloom — opens at the reveal */
    '  float d = length(p - vec2(uPointer.x * 0.05, 0.02));',
    '  float ring = smoothstep(0.62 * uPortal + 0.02, 0.0, d);',
    '  col = mix(col, vec3(1.0, 0.97, 0.88), ring * 0.55 * uPortal);',
    '  float halo = smoothstep(0.9 * uPortal, 0.25 * uPortal, d) - smoothstep(0.55 * uPortal, 0.1, d);',

    '  vec3 rainbow = 0.5 + 0.5 * cos(6.2831 * (vec3(0.0, 0.33, 0.67) + p.x * 0.6 + t * 0.4));',

    '  float star = hash(gid);',
    '  float tw = 0.5 + 0.5 * sin(uTime * 1.1 + star * 40.0);',
    '  float starMask = step(0.9965, star) * smoothstep(0.35, 0.95, uv.y);',

    '  col += (hash(gl_FragCoord.xy + uTime) - 0.5) * 0.006;',

    this.progress = 0;

    this.pointer = [0, 0];
    this.audio = [0, 0, 0];
    this.pal = [hexToVec('#FFE9A8'), hexToVec('#FFD1DC'), hexToVec('#7EC8E3')];

  Sky.prototype.setPalette = function (arr) {

    if (!this.ok) return;

    for (var i = 0; i < 3; i++) {

    gl.uniform2f(this.u.uRes, this.canvas.width, this.canvas.height);
    gl.uniform1f(this.u.uTime, time);
    gl.uniform1f(this.u.uProgress, this.progress);

    gl.uniform3fv(this.u.uPalB, this.pal[1]);

<script>
/* ============================================================================
 *  parallax.js — the depth engine
 *  ---------------------------------------------------------------------------
 *  Seven layers, each with a depth factor. Pointer, device tilt and the story's
 *  own camera all push a single target; every layer follows it at its own rate.
 *
 *  Two details that matter:
 *   - Damping is frame-rate independent. A plain lerp(a, b, 0.1) per frame moves
 *     twice as fast on a 120Hz phone as on a 60Hz laptop; the exponential form
 *     here behaves identically on both.
 *   - Exactly one transform write per layer per frame, from a single ticker.
 *     No layout properties are ever touched.
 * ==========================================================================*/
(function (XY) {
  'use strict';

  function Parallax(opts) {
    opts = opts || {};
    this.layers = [];
    this.px = 0; this.py = 0;          // damped current
    this.tx = 0; this.ty = 0;          // target from pointer/tilt
    this.camX = 0; this.camY = 0;      // pushed by the story timeline
    this.amp = opts.amp || 44;
    this.k = 6.0;
    this.tiltWeight = 0.6;
    this.enabled = true;
  }

  Parallax.prototype.add = function (el, depth) {
    if (!el) return;

    var self = this;

    var onMove = function (e) {
      var t = e.touches ? e.touches[0] : e;

      self.tx = XY.clamp((t.clientX / window.innerWidth - 0.5) * 2, -1, 1);
      self.ty = XY.clamp((t.clientY / window.innerHeight - 0.5) * 2, -1, 1);
    };
    root.addEventListener('pointermove', onMove, { passive: true });

    this._onTilt = function (e) {
      if (e.gamma === null || e.beta === null) return;
      var gx = XY.clamp(e.gamma / 25, -1, 1);
      var gy = XY.clamp((e.beta - 45) / 25, -1, 1);
      self.tx = XY.clamp(self.tx * 0.35 + gx * self.tiltWeight, -1, 1);
      self.ty = XY.clamp(self.ty * 0.35 + gy * self.tiltWeight, -1, 1);

  Parallax.prototype.enableTilt = function () {

        .then(function (r) { return r === 'granted' ? attach() : false; })
        .catch(function () { return false; });

<script>
/* ============================================================================
 *  confetti.js — a small pooled particle system on a 2D canvas
 *  ---------------------------------------------------------------------------
 *  Pooled, so a confetti storm never allocates mid-animation. Shapes are drawn
 *  as simple rounded rectangles and circles with a spin, which reads as paper
 *  without costing anything. Disabled entirely on the low quality tier and
 *  under prefers-reduced-motion.
 * ==========================================================================*/
(function (XY) {
  'use strict';

  var COLORS = ['#FFD84D', '#FF8FB1', '#9BE8C8', '#7EC8E3', '#C9A7F5', '#FFF8EE', '#FF9F6B'];

  function Confetti(canvas, max) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.max = max || 160;
    this.pool = [];

    this.dpr = 1;
    for (var i = 0; i < this.max; i++) {
      this.pool.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, rot: 0, vrot: 0,
                       size: 0, color: '#fff', life: 0, maxLife: 1, round: false });
    }

  Confetti.prototype.resize = function () {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = Math.max(1, Math.round(this.canvas.clientWidth * this.dpr));
    this.canvas.height = Math.max(1, Math.round(this.canvas.clientHeight * this.dpr));

    var dir = opts.direction === undefined ? -Math.PI / 2 : opts.direction;
    var power = opts.power || 1;
    for (var i = 0, made = 0; i < this.pool.length && made < n; i++) {
      var p = this.pool[i];
      if (p.on) continue;
      var a = dir + (Math.random() - 0.5) * spread;
      var sp = (2.2 + Math.random() * 4.4) * power;
      p.on = true; made++;
      p.x = x; p.y = y;
      p.vx = Math.cos(a) * sp;
      p.vy = Math.sin(a) * sp;
      p.rot = Math.random() * Math.PI * 2;
      p.vrot = (Math.random() - 0.5) * 0.32;
      p.size = 5 + Math.random() * 7;
      p.round = Math.random() < 0.35;
      p.color = opts.color || COLORS[(Math.random() * COLORS.length) | 0];
      p.maxLife = 1.6 + Math.random() * 1.6;
      p.life = p.maxLife;
      this.live++;

  };

  Confetti.prototype.update = function (dt) {
    if (this.live === 0) return;
    var ctx = this.ctx, d = this.dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    var h = this.canvas.height / d;
    var step = Math.min(dt, 0.05) * 60;   // clamp so a stalled tab doesn't teleport
    for (var i = 0; i < this.pool.length; i++) {
      var p = this.pool[i];
      if (!p.on) continue;
      p.life -= dt;
      if (p.life <= 0) { p.on = false; this.live--; continue; }
      p.vy += 0.16 * step;                // gravity
      p.vx *= 0.995;
      p.x += p.vx * step;
      p.y += p.vy * step;
      p.rot += p.vrot * step;

    for (var i = 0; i < this.pool.length; i++) this.pool[i].on = false;

/* ============================================================================
 *  audio.js — a music box, generated
 *  ---------------------------------------------------------------------------

 *  up, through a fast decay envelope and a lowpass, into a gentle delay. That

 *  guaranteed to be consonant with whatever the bed is playing, so the page can
